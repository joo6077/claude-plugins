# ── Harness Project Config Template ──
# .harness/project.yaml에 복사하여 프로젝트에 맞게 수정한다.
# 상세 스키마: README.md 참조

stack: ""  # flutter, rust, react, python 등

# ── 빌드/분석 명령 (필수) ──
commands:
  analyze: ""   # 예: "cargo clippy", "npx eslint"
  test: ""      # 예: "cargo test", "npx jest"
  lint: null    # 선택
  format: null  # 선택
  codegen: null # 선택

# ── 계약 카테고리 (필수, 최소 1개) ──
contract_categories:
  - id: UI
    prefix: "UI"
    description: "화면/컴포넌트에 무엇이 표시되는지"
  - id: Logic
    prefix: "LG"
    description: "데이터 흐름, 상태 변환, 비즈니스 규칙"
  - id: Error
    prefix: "ER"
    description: "에러 상황에서 어떻게 동작하는지"
  - id: Architecture
    prefix: "AR"
    description: "모듈 구조, 파일 위치, 의존 방향"

# ── 안티패턴 (필수, 최소 2개 권장) ──
anti_patterns: []
  # - id: AP-01
  #   pattern: "regex"          # ripgrep 정규식 (command 가 없으면 필수)
  #   message: "설명"
  #
  # 줄 단위 정규식으로 판정할 수 없는 검사는 command 로 도구에 위임한다.
  # (여는/닫는 fence 가 동형인 코드펜스 검사 등 — 자세한 기준은 harness/README.md)
  # - id: AP-02
  #   command: "python3 scripts/validate-plugin.py --check=code-fence"
  #   message: "설명"           # exit 0 = 위반 없음, non-zero = FAIL

# ── 재사용성 ──
reusability:
  shared_path: ""
  check_duplicate: true

# ── Diagnostics ──
diagnostics:
  ide_exclude: []
  console_errors: []
  console_exclude: []

# ── 환경 (선택) ──
# env 섹션은 .harness/env.sh로 관리. 여기선 참조만.

# ── 런타임 검증 (선택) ──
runtime_inspection:
  mcp_server: null
  vm_port: null
  launch_script: null

# ── 트리거 조건 (선택 — 기본값 있음) ──
trigger:
  min_files: 2
  always: []
  never: []

# ── 검증 절차 ──
verification:
  procedures_dir: ".harness/procedures/"

# ── 프로젝트별 변명 차단 (선택) ──
rationalization_overrides:
  # 가드 우회 금지 — 실측 사례(digest `bypass-run-guard-by-cwd`): 가드가 막자
  # cwd 를 다른 디렉토리로 옮겨 다른 .harness/env.sh 를 소싱해 통과시킨 일이 있었다.
  - excuse: "가드가 막아서 cwd 를 옮기거나 다른 설정을 소싱해 통과시켰다"
    reality: "가드 조건을 충족시키거나 사용자에게 보고하라. 우회로 얻은 통과는 미검증이다"
  # - excuse: "변명"
  #   reality: "현실"
