<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0d14;--bg2:#12121c;--surface:#181825;--surface2:#1e1e30;--border:#2a2a40;
    --text:#F5F0E8;--text2:#A89A8F;--text3:#7A6F64;
    --accent:{{ACCENT}};--accent2:{{ACCENT2}};--accent-dim:rgba({{ACCENT_R}},{{ACCENT_G}},{{ACCENT_B}},0.12);
    --green:#4ade80;--red:#f87171;--yellow:#fbbf24;
    --radius:14px;--transition:0.25s cubic-bezier(.4,0,.2,1);
    --mono:'SF Mono','Cascadia Code','Consolas',monospace;
  }
  /* Light theme — dark-first 팔레트의 오버라이드. 키/폴백은 design-kit/templates/base.html 규약을 따른다 */
  [data-theme="light"]{
    --bg:#faf9f7;--bg2:#f2f0ec;--surface:#ffffff;--surface2:#f5f3ef;--border:#e0dcd4;
    --text:#1a1a24;--text2:#5a5248;--text3:#8a8078;
  }
  html{font-size:16px;scroll-behavior:smooth}
  body{
    font-family:'Pretendard Variable','Pretendard',-apple-system,'Segoe UI',system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;
    background-image:radial-gradient(ellipse at 20% 0%,rgba({{ACCENT_R}},{{ACCENT_G}},{{ACCENT_B}},0.06) 0%,transparent 50%),
                     radial-gradient(ellipse at 80% 100%,rgba({{ACCENT_R}},{{ACCENT_G}},{{ACCENT_B}},0.03) 0%,transparent 50%);
  }
  .page{max-width:1280px;margin:0 auto;padding:clamp(20px,4vw,56px)}

  /* Typography */
  h1{font-size:clamp(26px,3.5vw,40px);font-weight:800;letter-spacing:-0.5px;line-height:1.15;
    background:linear-gradient(135deg,var(--text),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{color:var(--text2);font-size:clamp(14px,1.3vw,16px);margin-top:8px;margin-bottom:clamp(32px,5vw,56px);max-width:720px;line-height:1.7}
  h2{font-size:clamp(20px,2.2vw,28px);font-weight:700;margin-bottom:8px;letter-spacing:-0.3px}
  h3{font-size:clamp(15px,1.5vw,18px);font-weight:700;margin-bottom:6px}
  .section{margin-bottom:clamp(48px,6vw,80px)}
  .section-label{
    font-size:clamp(11px,1vw,13px);font-weight:700;text-transform:uppercase;letter-spacing:2px;
    color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:12px;
  }
  .section-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--accent) 0%,transparent 80%)}
  .desc{color:var(--text2);font-size:clamp(13px,1.1vw,15px);line-height:1.7;max-width:680px;margin-bottom:24px}
  .caption{color:var(--text3);font-size:12px;text-align:center;margin-top:12px}
  .tag{display:inline-block;background:var(--accent-dim);color:var(--accent);font-size:11px;font-weight:700;
    padding:3px 10px;border-radius:20px;letter-spacing:0.5px}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(16px,2.5vw,28px);transition:border-color var(--transition)}
  .card:hover{border-color:rgba({{ACCENT_R}},{{ACCENT_G}},{{ACCENT_B}},0.25)}
  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
  .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
  .grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
  .mono{font-family:var(--mono);font-size:12px}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:10px 14px;color:var(--text2);font-weight:600;border-bottom:2px solid var(--border);font-size:12px;letter-spacing:0.5px;text-transform:uppercase}
  td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text2)}
  tr:hover td{background:rgba({{ACCENT_R}},{{ACCENT_G}},{{ACCENT_B}},0.03)}
  td code{font-family:var(--mono);font-size:12px;background:var(--surface2);padding:2px 6px;border-radius:4px}

  /* Checklist */
  .checklist{list-style:none;display:flex;flex-direction:column;gap:8px}
  .checklist li{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--text2);line-height:1.6}
  .checklist .check{width:18px;height:18px;border-radius:4px;border:2px solid var(--accent);flex-shrink:0;margin-top:2px;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent)}

  /* Compare panels */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:640px){.compare{grid-template-columns:1fr}}
  .compare-bad,.compare-good{border-radius:12px;padding:20px;position:relative}
  .compare-bad{background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.2)}
  .compare-good{background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.2)}
  .compare-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
  .compare-bad .compare-label{color:var(--red)}
  .compare-good .compare-label{color:var(--green)}

  /* Number badge */
  .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;
    background:var(--accent-dim);color:var(--accent);font-size:12px;font-weight:800;flex-shrink:0}

  /* ════════════════════════════════════════════════════════════════════
     가로 오버플로 방지 — 아래 4 블록은 제거·완화 금지 (하드 제약)
     근거: 146 페이지 중 66 개가 375px 에서 오버플로했고 원인이 아래로 수렴했다.
     내용을 자르지(overflow:hidden) 말고 스크롤 가능하게 두는 것이 원칙이다.
     ════════════════════════════════════════════════════════════════════ */

  /* (1) grid/flex 자식의 기본 min-width 는 auto(= min-content) 다.
         긴 코드·표·안 끊기는 토큰의 최소폭이 트랙 폭으로 그대로 전파되어 문서를 밀어낸다. */
  .grid-2>*,.grid-3>*,.grid-4>*,.compare>*{min-width:0}

  /* (2) 표는 컬럼 폭 합계가 그대로 전파된다. 자르지 말고 가로 스크롤 컨테이너로 감싼다.
         마크업: <div class="table-wrap"><table>…</table></div> */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  .table-wrap>table{min-width:max-content}

  /* (3) white-space:pre 인 코드 블록도 내용폭이 전파된다. 컨테이너에서 스크롤시킨다. */
  pre{overflow-x:auto;max-width:100%}
  pre code{white-space:pre}
  :not(pre)>code{overflow-wrap:anywhere}

  /* (4) 터치 타겟 — WCAG 2.2 SC 2.5.5 (AAA) 44×44 CSS px */
  button,.btn,[role="button"]{min-height:44px;min-width:44px}

  /* 좁은 뷰포트에서 다중 컬럼은 단일 컬럼으로 스택한다 (.compare 는 위 640px 규칙 참조) */
  @media(max-width:600px){
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  }

  /* Theme toggle */
  .theme-toggle{position:absolute;top:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);
    background:var(--surface);color:var(--text2);border:1px solid var(--border);border-radius:10px;
    padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;transition:border-color var(--transition)}
  .theme-toggle:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="page" style="position:relative">

<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="테마 전환">&#127769; Dark</button>

<h1>{{PAGE_TITLE}}</h1>
<p class="subtitle">{{PAGE_SUBTITLE}}</p>

<!-- ── Section 1 ── -->
<div class="section">
  <div class="section-label">{{SECTION_1_LABEL}}</div>
  <p class="desc">{{SECTION_1_DESC}}</p>
  <!-- 콘텐츠: .card, .grid-2/3, table, .compare 등을 조합 -->
</div>

</div>

<script>
// Theme toggle — 키(dk-theme)와 prefers-color-scheme 폴백은 design-kit/templates/base.html 규약.
// 이 페이지 계열은 dark-first 이므로 저장값이 없으면 시스템 설정을 따르고, 그것도 없으면 dark.
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = t === 'dark' ? '\u{1F319} Dark' : '☀️ Light';
}
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('dk-theme', next);
  applyTheme(next);
}
(function initTheme(){
  const saved = localStorage.getItem('dk-theme')
    ?? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyTheme(saved);
})()
</script>
</body>
</html>
