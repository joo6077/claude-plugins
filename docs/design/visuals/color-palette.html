<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시맨틱 컬러 팔레트</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1117;--surface:#1a1d27;--surface2:#242837;--border:#2e3348;
    --text:#e8eaed;--text2:#9aa0b4;--text3:#636980;
    --radius:12px;--transition:0.3s cubic-bezier(.4,0,.2,1);
  }
  [data-theme="light"]{
    --bg:#f5f6fa;--surface:#ffffff;--surface2:#eef0f5;--border:#d8dce6;
    --text:#1a1d27;--text2:#636980;--text3:#9aa0b4;
  }
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:32px;transition:background var(--transition),color var(--transition)}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
  h1{font-size:28px;font-weight:700;letter-spacing:-0.5px}
  .theme-toggle{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:6px 16px;cursor:pointer;color:var(--text);font-size:14px;transition:all var(--transition)}
  .theme-toggle:hover{border-color:var(--text3)}
  .theme-toggle .icon{font-size:18px}
  .section{margin-bottom:48px}
  .section-title{font-size:18px;font-weight:600;margin-bottom:20px;color:var(--text2)}
  .palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .color-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all var(--transition)}
  .color-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.2)}
  .color-swatch{height:100px;position:relative;display:flex;align-items:flex-end;padding:10px}
  .color-hex{font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;backdrop-filter:blur(8px)}
  .color-info{padding:14px}
  .color-name{font-size:14px;font-weight:600;margin-bottom:4px}
  .color-role{font-size:12px;color:var(--text2)}
  .contrast-section{margin-top:32px}
  .contrast-checker{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
  .contrast-inputs{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .input-group{flex:1;min-width:180px}
  .input-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
  .color-input-wrap{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 12px}
  .color-input-wrap input[type="color"]{width:32px;height:32px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0}
  .color-input-wrap input[type="text"]{background:none;border:none;color:var(--text);font-size:14px;font-family:monospace;width:80px;outline:none}
  .contrast-result{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .ratio-display{font-size:36px;font-weight:700;font-family:monospace}
  .badges{display:flex;gap:8px;flex-wrap:wrap}
  .badge{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600}
  .badge.pass{background:#1a3a2a;color:#4ade80}
  .badge.fail{background:#3a1a1a;color:#f87171}
  [data-theme="light"] .badge.pass{background:#dcfce7;color:#16a34a}
  [data-theme="light"] .badge.fail{background:#fee2e2;color:#dc2626}
  .preview-box{margin-top:16px;padding:20px;border-radius:8px;font-size:16px}
  .preview-box .large{font-size:24px;font-weight:700}
  .preview-box .small{font-size:14px;margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <h1>시맨틱 컬러 팔레트</h1>
  <button class="theme-toggle" onclick="toggleTheme()">
    <span class="icon" id="themeIcon">🌙</span>
    <span id="themeLabel">다크 모드</span>
  </button>
</div>

<div class="section">
  <div class="section-title">Primary</div>
  <div class="palette-grid" id="primaryColors"></div>
</div>
<div class="section">
  <div class="section-title">Secondary</div>
  <div class="palette-grid" id="secondaryColors"></div>
</div>
<div class="section">
  <div class="section-title">Surface</div>
  <div class="palette-grid" id="surfaceColors"></div>
</div>
<div class="section">
  <div class="section-title">Semantic</div>
  <div class="palette-grid" id="semanticColors"></div>
</div>

<div class="section contrast-section">
  <div class="section-title">대비율 체커 (Contrast Ratio Checker)</div>
  <div class="contrast-checker">
    <div class="contrast-inputs">
      <div class="input-group">
        <label>전경색 (Foreground)</label>
        <div class="color-input-wrap">
          <input type="color" id="fgColor" value="#e8eaed" oninput="updateContrast()">
          <input type="text" id="fgHex" value="#e8eaed" oninput="syncColor('fg')">
        </div>
      </div>
      <div class="input-group">
        <label>배경색 (Background)</label>
        <div class="color-input-wrap">
          <input type="color" id="bgColor" value="#0f1117" oninput="updateContrast()">
          <input type="text" id="bgHex" value="#0f1117" oninput="syncColor('bg')">
        </div>
      </div>
    </div>
    <div class="contrast-result">
      <div class="ratio-display" id="ratioValue">15.2:1</div>
      <div class="badges" id="badges"></div>
    </div>
    <div class="preview-box" id="previewBox">
      <div class="large">큰 텍스트 미리보기 (24px Bold)</div>
      <div class="small">작은 텍스트 미리보기 (14px Regular) — 가나다라마바사 ABCDEFG 0123456789</div>
    </div>
  </div>
</div>

<script>
const palettes={
  light:{
    primary:[
      {name:'Primary',hex:'#2563eb',role:'주요 액션, 브랜드 강조'},
      {name:'On Primary',hex:'#ffffff',role:'Primary 위 텍스트/아이콘'},
      {name:'Primary Container',hex:'#dbeafe',role:'Primary 약한 배경'},
      {name:'On Primary Container',hex:'#1e3a5f',role:'Container 위 텍스트'},
    ],
    secondary:[
      {name:'Secondary',hex:'#7c3aed',role:'보조 액션, 강조'},
      {name:'On Secondary',hex:'#ffffff',role:'Secondary 위 텍스트'},
      {name:'Secondary Container',hex:'#ede9fe',role:'Secondary 약한 배경'},
      {name:'On Secondary Container',hex:'#3b1d6e',role:'Container 위 텍스트'},
    ],
    surface:[
      {name:'Background',hex:'#f5f6fa',role:'페이지 배경'},
      {name:'Surface',hex:'#ffffff',role:'카드, 시트 배경'},
      {name:'Surface Variant',hex:'#eef0f5',role:'구분 영역 배경'},
      {name:'Outline',hex:'#d8dce6',role:'테두리, 구분선'},
      {name:'On Surface',hex:'#1a1d27',role:'주요 텍스트'},
      {name:'On Surface Variant',hex:'#636980',role:'보조 텍스트'},
    ],
    semantic:[
      {name:'Error',hex:'#dc2626',role:'에러 상태'},
      {name:'Error Container',hex:'#fee2e2',role:'에러 약한 배경'},
      {name:'Success',hex:'#16a34a',role:'성공 상태'},
      {name:'Success Container',hex:'#dcfce7',role:'성공 약한 배경'},
      {name:'Warning',hex:'#d97706',role:'경고 상태'},
      {name:'Warning Container',hex:'#fef3c7',role:'경고 약한 배경'},
      {name:'Info',hex:'#0284c7',role:'정보 상태'},
      {name:'Info Container',hex:'#e0f2fe',role:'정보 약한 배경'},
    ]
  },
  dark:{
    primary:[
      {name:'Primary',hex:'#60a5fa',role:'주요 액션, 브랜드 강조'},
      {name:'On Primary',hex:'#1e3a5f',role:'Primary 위 텍스트/아이콘'},
      {name:'Primary Container',hex:'#1e3a5f',role:'Primary 약한 배경'},
      {name:'On Primary Container',hex:'#dbeafe',role:'Container 위 텍스트'},
    ],
    secondary:[
      {name:'Secondary',hex:'#a78bfa',role:'보조 액션, 강조'},
      {name:'On Secondary',hex:'#3b1d6e',role:'Secondary 위 텍스트'},
      {name:'Secondary Container',hex:'#3b1d6e',role:'Secondary 약한 배경'},
      {name:'On Secondary Container',hex:'#ede9fe',role:'Container 위 텍스트'},
    ],
    surface:[
      {name:'Background',hex:'#0f1117',role:'페이지 배경'},
      {name:'Surface',hex:'#1a1d27',role:'카드, 시트 배경'},
      {name:'Surface Variant',hex:'#242837',role:'구분 영역 배경'},
      {name:'Outline',hex:'#2e3348',role:'테두리, 구분선'},
      {name:'On Surface',hex:'#e8eaed',role:'주요 텍스트'},
      {name:'On Surface Variant',hex:'#9aa0b4',role:'보조 텍스트'},
    ],
    semantic:[
      {name:'Error',hex:'#f87171',role:'에러 상태'},
      {name:'Error Container',hex:'#3a1a1a',role:'에러 약한 배경'},
      {name:'Success',hex:'#4ade80',role:'성공 상태'},
      {name:'Success Container',hex:'#1a3a2a',role:'성공 약한 배경'},
      {name:'Warning',hex:'#fbbf24',role:'경고 상태'},
      {name:'Warning Container',hex:'#3a2d0a',role:'경고 약한 배경'},
      {name:'Info',hex:'#38bdf8',role:'정보 상태'},
      {name:'Info Container',hex:'#0a2a3a',role:'정보 약한 배경'},
    ]
  }
};

let currentTheme='dark';

function getContrastTextColor(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  return lum>0.5?'rgba(0,0,0,0.87)':'rgba(255,255,255,0.95)';
}

function renderPalette(containerId,colors){
  const c=document.getElementById(containerId);
  c.innerHTML=colors.map(cl=>`
    <div class="color-card">
      <div class="color-swatch" style="background:${cl.hex}">
        <span class="color-hex" style="background:rgba(0,0,0,0.3);color:#fff">${cl.hex}</span>
      </div>
      <div class="color-info">
        <div class="color-name">${cl.name}</div>
        <div class="color-role">${cl.role}</div>
      </div>
    </div>
  `).join('');
}

function renderAll(){
  const p=palettes[currentTheme];
  renderPalette('primaryColors',p.primary);
  renderPalette('secondaryColors',p.secondary);
  renderPalette('surfaceColors',p.surface);
  renderPalette('semanticColors',p.semantic);
}

function toggleTheme(){
  if(currentTheme==='dark'){currentTheme='light';document.body.setAttribute('data-theme','light');document.getElementById('themeIcon').textContent='☀️';document.getElementById('themeLabel').textContent='라이트 모드'}
  else{currentTheme='dark';document.body.removeAttribute('data-theme');document.getElementById('themeIcon').textContent='🌙';document.getElementById('themeLabel').textContent='다크 모드'}
  renderAll();
}

function hexToRgb(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];return{r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)}}
function luminance(r,g,b){const a=[r,g,b].map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2]}
function contrastRatio(hex1,hex2){const c1=hexToRgb(hex1),c2=hexToRgb(hex2);const l1=luminance(c1.r,c1.g,c1.b),l2=luminance(c2.r,c2.g,c2.b);const lighter=Math.max(l1,l2),darker=Math.min(l1,l2);return(lighter+0.05)/(darker+0.05)}

function updateContrast(){
  const fg=document.getElementById('fgColor').value;
  const bg=document.getElementById('bgColor').value;
  document.getElementById('fgHex').value=fg;
  document.getElementById('bgHex').value=bg;
  const ratio=contrastRatio(fg,bg);
  document.getElementById('ratioValue').textContent=ratio.toFixed(1)+':1';
  const badges=document.getElementById('badges');
  const aaLarge=ratio>=3,aaNormal=ratio>=4.5,aaaLarge=ratio>=4.5,aaaNormal=ratio>=7;
  badges.innerHTML=`
    <span class="badge ${aaNormal?'pass':'fail'}">AA 일반 텍스트 ${aaNormal?'통과':'실패'}</span>
    <span class="badge ${aaLarge?'pass':'fail'}">AA 큰 텍스트 ${aaLarge?'통과':'실패'}</span>
    <span class="badge ${aaaNormal?'pass':'fail'}">AAA 일반 텍스트 ${aaaNormal?'통과':'실패'}</span>
    <span class="badge ${aaaLarge?'pass':'fail'}">AAA 큰 텍스트 ${aaaLarge?'통과':'실패'}</span>
  `;
  const box=document.getElementById('previewBox');
  box.style.background=bg;box.style.color=fg;
}

function syncColor(type){
  const hex=document.getElementById(type+'Hex').value;
  if(/^#[0-9a-fA-F]{6}$/.test(hex)){document.getElementById(type+'Color').value=hex;updateContrast()}
}

renderAll();updateContrast();
</script>
</body>
</html>
