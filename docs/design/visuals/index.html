<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 파운데이션즈 — Navigation Hub</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#0f1018;--surface:#141520;--surface2:#1a1c2a;--surface3:#22253a;
  --border:#2a2e45;--border2:#363b58;
  --text:#e8eaf0;--text2:#9298b0;--text3:#606882;
  --accent:#6b9bff;--accent2:#a78bfa;--accent-dim:rgba(107,155,255,0.12);
  --accent-glow:rgba(107,155,255,0.06);
  --sidebar-w:280px;
  --topbar-h:52px;
  --radius:8px;
  --transition:0.25s cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Pretendard Variable','Pretendard',-apple-system,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
}

/* === SCROLLBAR === */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border2)}

/* === TOPBAR === */
.topbar{
  position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--topbar-h);
  background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 24px;gap:12px;z-index:100;
}
.topbar .hamburger{
  display:none;width:36px;height:36px;border:none;background:transparent;
  color:var(--text2);cursor:pointer;border-radius:var(--radius);
  transition:var(--transition);
}
.topbar .hamburger:hover{background:var(--surface2);color:var(--text)}
.topbar .hamburger svg{width:20px;height:20px}
.breadcrumb{font-size:13px;color:var(--text3);display:flex;align-items:center;gap:6px}
.breadcrumb .sep{font-size:11px;opacity:0.5}
.breadcrumb .cat{color:var(--text3)}
.breadcrumb .page{color:var(--text2)}
.page-title{font-size:15px;font-weight:600;color:var(--text);margin-left:auto}

/* === SIDEBAR === */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:200;
  transition:transform var(--transition);
}
.sidebar-header{
  padding:20px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.sidebar-logo{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.02em}
.sidebar-subtitle{font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:0.02em}
.search-box{
  margin-top:14px;position:relative;
}
.search-box input{
  width:100%;height:34px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:0 12px 0 32px;
  font-size:13px;color:var(--text);outline:none;transition:var(--transition);
  font-family:inherit;
}
.search-box input::placeholder{color:var(--text3)}
.search-box input:focus{border-color:var(--accent);background:var(--surface2)}
.search-box .search-icon{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--text3);pointer-events:none;
}
.search-box .search-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;border:none;background:transparent;color:var(--text3);
  cursor:pointer;display:none;border-radius:50%;padding:0;
  transition:var(--transition);
}
.search-box .search-clear:hover{color:var(--text);background:var(--surface3)}
.search-box.has-value .search-clear{display:flex;align-items:center;justify-content:center}

.sidebar-nav{
  flex:1;overflow-y:auto;padding:12px 0 20px;
}
.nav-category{
  padding:16px 20px 6px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);
  user-select:none;
}
.nav-category:first-child{padding-top:8px}
.nav-item{
  display:flex;align-items:center;padding:7px 20px 7px 24px;
  font-size:13px;color:var(--text2);cursor:pointer;position:relative;
  transition:var(--transition);border-left:3px solid transparent;
  user-select:none;
}
.nav-item:hover{background:var(--accent-dim);color:var(--text)}
.nav-item.active{
  color:var(--accent);background:var(--accent-dim);
  border-left-color:var(--accent);font-weight:500;
}
.nav-item.focused{outline:2px solid var(--accent);outline-offset:-2px;border-radius:2px}
.nav-item .nav-icon{
  width:16px;height:16px;margin-right:10px;flex-shrink:0;opacity:0.6;
}
.nav-item.active .nav-icon{opacity:1}
.nav-item.hidden{display:none}
.nav-category.hidden{display:none}

.sidebar-footer{
  padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0;
  font-size:11px;color:var(--text3);
}
.sidebar-footer kbd{
  display:inline-block;padding:1px 5px;background:var(--surface);
  border:1px solid var(--border);border-radius:4px;font-size:10px;
  font-family:inherit;color:var(--text3);margin:0 1px;
}

/* === MAIN === */
.main{
  position:fixed;top:var(--topbar-h);left:var(--sidebar-w);right:0;bottom:0;
}
.main iframe{
  width:100%;height:100%;border:none;background:var(--bg);
  opacity:1;transition:opacity 0.2s ease;
}
.main iframe.loading{opacity:0.3}

/* === OVERLAY (mobile) === */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:150;
  opacity:0;transition:opacity var(--transition);pointer-events:none;
}
.overlay.visible{opacity:1;pointer-events:auto}

/* === NO RESULTS === */
.no-results{
  padding:20px;text-align:center;font-size:13px;color:var(--text3);display:none;
}

/* === MOBILE === */
@media(max-width:767px){
  :root{--sidebar-w:0px}
  .sidebar{
    width:300px;transform:translateX(-100%);
    box-shadow:4px 0 24px rgba(0,0,0,0.4);
  }
  .sidebar.open{transform:translateX(0)}
  .overlay.mobile-active{display:block}
  .topbar{left:0}
  .topbar .hamburger{display:flex;align-items:center;justify-content:center}
  .main{left:0}
}
</style>
</head>
<body>

<!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">디자인 파운데이션즈</div>
    <div class="sidebar-subtitle">Design Foundations</div>
    <div class="search-box" id="searchBox">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
      <input type="text" id="searchInput" placeholder="페이지 검색…" autocomplete="off" spellcheck="false">
      <button class="search-clear" id="searchClear" title="지우기">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>
      </button>
    </div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <!-- Populated by JS -->
  </nav>
  <div class="no-results" id="noResults">검색 결과가 없습니다</div>
  <div class="sidebar-footer">
    <kbd>↑</kbd><kbd>↓</kbd> 이동 &nbsp;<kbd>Enter</kbd> 열기
  </div>
</aside>

<!-- Topbar -->
<header class="topbar" id="topbar">
  <button class="hamburger" id="hamburger" aria-label="메뉴 열기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>
  <div class="breadcrumb" id="breadcrumb">
    <span class="cat" id="bcCat"></span>
    <span class="sep">›</span>
    <span class="page" id="bcPage"></span>
  </div>
  <div class="page-title" id="pageTitle"></div>
</header>

<!-- Main content -->
<main class="main" id="main">
  <iframe id="contentFrame" title="콘텐츠"></iframe>
</main>

<script>
(function(){
  'use strict';

  // Page data
  const categories = [
    {
      label: '기초 원칙',
      pages: [
        { id: 'visual-hierarchy',  title: '시각적 계층',         file: 'visual-hierarchy.html' },
        { id: 'grid-alignment',    title: '그리드 & 정렬',       file: 'grid-alignment.html' },
        { id: 'ratio-proportion',  title: '비율과 프로포션',     file: 'ratio-proportion.html' },
      ]
    },
    {
      label: '시각 요소',
      pages: [
        { id: 'typography-scale',  title: '타이포그래피',         file: 'typography-scale.html' },
        { id: 'color-palette',     title: '컬러',                 file: 'color-palette.html' },
        { id: 'iconography',       title: '아이코노그래피',       file: 'iconography.html' },
        { id: 'image-illustration',title: '이미지 & 일러스트',   file: 'image-illustration.html' },
      ]
    },
    {
      label: '레이아웃 & 구조',
      pages: [
        { id: 'spacing-system',    title: '스페이싱',             file: 'spacing-system.html' },
        { id: 'information-density',title: '정보 밀도',           file: 'information-density.html' },
        { id: 'motion',            title: '모션',                 file: 'motion.html' },
        { id: 'animation',         title: '애니메이션',           file: 'animation.html' },
      ]
    },
    {
      label: '인터랙션 & 윤리',
      pages: [
        { id: 'microinteraction',  title: '마이크로인터랙션',     file: 'microinteraction.html' },
        { id: 'ethical-design',    title: '다크패턴 방지',       file: 'ethical-design.html' },
      ]
    }
  ];

  // Flatten for lookup
  const allPages = [];
  categories.forEach(cat => {
    cat.pages.forEach(p => {
      p.category = cat.label;
      allPages.push(p);
    });
  });

  // DOM refs
  const sidebar     = document.getElementById('sidebar');
  const sidebarNav  = document.getElementById('sidebarNav');
  const overlay     = document.getElementById('overlay');
  const hamburger   = document.getElementById('hamburger');
  const searchInput = document.getElementById('searchInput');
  const searchBox   = document.getElementById('searchBox');
  const searchClear = document.getElementById('searchClear');
  const noResults   = document.getElementById('noResults');
  const bcCat       = document.getElementById('bcCat');
  const bcPage      = document.getElementById('bcPage');
  const pageTitle   = document.getElementById('pageTitle');
  const frame       = document.getElementById('contentFrame');

  let currentPageId = null;
  let focusedIndex  = -1;

  // Build nav
  function buildNav() {
    sidebarNav.innerHTML = '';
    categories.forEach(cat => {
      const catEl = document.createElement('div');
      catEl.className = 'nav-category';
      catEl.textContent = cat.label;
      catEl.dataset.category = cat.label;
      sidebarNav.appendChild(catEl);

      cat.pages.forEach(p => {
        const item = document.createElement('div');
        item.className = 'nav-item';
        item.dataset.id = p.id;
        item.dataset.category = cat.label;
        item.innerHTML = getIcon(p.id) + '<span>' + p.title + '</span>';
        item.addEventListener('click', () => navigate(p.id));
        sidebarNav.appendChild(item);
      });
    });
  }

  function getIcon(id) {
    const icons = {
      'visual-hierarchy':   '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="12,2 22,20 2,20"/></svg>',
      'grid-alignment':     '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
      'ratio-proportion':   '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3 A5.5 5.5 0 0 1 17.5 8.5"/></svg>',
      'typography-scale':   '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7V4h16v3"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="8" y1="20" x2="16" y2="20"/></svg>',
      'color-palette':      '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="8" r="2" fill="currentColor"/><circle cx="8" cy="14" r="2" fill="currentColor"/><circle cx="16" cy="14" r="2" fill="currentColor"/></svg>',
      'iconography':        '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',
      'image-illustration': '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
      'spacing-system':     '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="4" x2="18" y2="20"/><line x1="6" y1="4" x2="6" y2="20"/><line x1="6" y1="12" x2="18" y2="12"/></svg>',
      'information-density':'<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="4" y1="14" x2="16" y2="14"/><line x1="4" y1="18" x2="12" y2="18"/></svg>',
      'motion':             '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5,3 19,12 5,21"/></svg>',
      'animation':          '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 0 1 0 20"/><path d="M12 5a7 7 0 0 1 0 14"/></svg>',
      'microinteraction':   '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 15l-2 5L9 9l11 4-5 2z"/></svg>',
      'ethical-design':     '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
    };
    return icons[id] || '';
  }

  // Navigate
  function navigate(id) {
    const page = allPages.find(p => p.id === id);
    if (!page) return;

    currentPageId = id;

    // Update active state
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === id);
    });

    // Update breadcrumb + title
    bcCat.textContent = page.category;
    bcPage.textContent = page.title;
    pageTitle.textContent = page.title;

    // Load iframe
    frame.classList.add('loading');
    frame.src = page.file;

    // Save to localStorage
    try { localStorage.setItem('design-nav-last', id); } catch(e) {}

    // Close mobile sidebar
    closeSidebar();
  }

  frame.addEventListener('load', () => {
    frame.classList.remove('loading');
  });

  // Mobile sidebar
  function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('visible', 'mobile-active');
    searchInput.focus();
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('visible');
  }
  hamburger.addEventListener('click', openSidebar);
  overlay.addEventListener('click', closeSidebar);

  // Search
  function filterNav(query) {
    const q = query.toLowerCase().trim();
    let visibleCount = 0;

    searchBox.classList.toggle('has-value', q.length > 0);

    const catElements = sidebarNav.querySelectorAll('.nav-category');
    const itemElements = sidebarNav.querySelectorAll('.nav-item');

    // Show/hide items
    itemElements.forEach(el => {
      const page = allPages.find(p => p.id === el.dataset.id);
      const match = !q || page.title.toLowerCase().includes(q) || page.id.includes(q) || page.category.toLowerCase().includes(q);
      el.classList.toggle('hidden', !match);
      if (match) visibleCount++;
    });

    // Show/hide categories
    catElements.forEach(catEl => {
      const catName = catEl.dataset.category;
      const hasVisibleChild = Array.from(itemElements).some(
        el => el.dataset.category === catName && !el.classList.contains('hidden')
      );
      catEl.classList.toggle('hidden', !hasVisibleChild);
    });

    noResults.style.display = visibleCount === 0 ? 'block' : 'none';
    focusedIndex = -1;
    clearFocus();
  }

  searchInput.addEventListener('input', () => filterNav(searchInput.value));
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    filterNav('');
    searchInput.focus();
  });

  // Keyboard navigation
  function getVisibleItems() {
    return Array.from(sidebarNav.querySelectorAll('.nav-item:not(.hidden)'));
  }

  function clearFocus() {
    document.querySelectorAll('.nav-item.focused').forEach(el => el.classList.remove('focused'));
  }

  function setFocus(index) {
    const items = getVisibleItems();
    if (items.length === 0) return;
    clearFocus();
    focusedIndex = Math.max(0, Math.min(index, items.length - 1));
    items[focusedIndex].classList.add('focused');
    items[focusedIndex].scrollIntoView({ block: 'nearest' });
  }

  document.addEventListener('keydown', (e) => {
    // Don't capture if typing in iframe
    if (document.activeElement === frame) return;

    const items = getVisibleItems();

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setFocus(focusedIndex + 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setFocus(focusedIndex - 1);
    } else if (e.key === 'Enter' && focusedIndex >= 0 && focusedIndex < items.length) {
      e.preventDefault();
      const id = items[focusedIndex].dataset.id;
      navigate(id);
    } else if (e.key === 'Escape') {
      if (searchInput.value) {
        searchInput.value = '';
        filterNav('');
      } else {
        closeSidebar();
      }
    } else if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  // Init
  buildNav();

  // Restore last page or default to first
  let startPage = allPages[0].id;
  try {
    const saved = localStorage.getItem('design-nav-last');
    if (saved && allPages.find(p => p.id === saved)) startPage = saved;
  } catch(e) {}
  navigate(startPage);

})();
</script>
</body>
</html>
