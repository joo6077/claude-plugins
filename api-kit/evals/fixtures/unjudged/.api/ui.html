<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>api-kit · 계약 뷰어 — shopflow API</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  /* spacing — 4px 배수 스케일 */
  --s1:4px;  --s2:8px;  --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s7:28px; --s8:32px; --s10:40px; --s12:48px;

  /* radius */
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-full:999px;

  /* type */
  --font-ui:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Noto Sans KR", monospace;
  --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-base:15px; --fs-lg:17px; --fs-xl:21px;
  --lh-tight:1.3; --lh-base:1.6;

  /* motion */
  --ease:cubic-bezier(.22,.61,.24,1);
  --t-fast:150ms var(--ease);
  --t-mid:200ms var(--ease);
  --t-slow:250ms var(--ease);

  /* surfaces — light */
  --bg-app:#f5f7fa;
  --bg-surface:#ffffff;
  --bg-sunken:#ebeef5;
  --bg-code:#faf9f6;
  --bg-hover:rgba(48,49,51,.05);
  --bg-active:rgba(48,49,51,.09);
  --bg-sel:#e0ecd8;
  --bg-sel-bar:#457335;

  /* lines */
  --line:#e4e7ed;
  --line-strong:#dcdfe6;

  /* text */
  --tx-1:#303133;
  --tx-2:#606266;
  /* park-golf 의 text-secondary(#909399)는 흰 배경 3.4:1 이라 본문에 못 쓴다 — 4.8:1 로 내렸다 */
  --tx-3:#6b7280;

  /* brand + semantic */
  --accent:#457335;          /* Forest Canopy primary-600 */
  --accent-hover:#375d2c;    /* primary-700 */
  --accent-lite:#74a85f;     /* primary-400 — 그라데이션 밝은 쪽 */
  /* park-golf Glassmorphism */
  --glass-bg:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.45);
  --glass-blur:20px;
  --sh-btn:0 4px 16px rgba(69,115,53,.32);
  --sw-thumb:#ffffff;        /* 스위치 손잡이 — 두 테마 모두 흰색 (park-golf .switch-thumb) */
  --sh-btn-hover:0 8px 24px rgba(116,168,95,.4);
  --on-solid:#ffffff;
  --accent-soft:#e0ecd8;     /* primary-100 */
  --accent-line:#c2d9b3;     /* primary-200 */

  /* park-golf success / danger / warning / info(teal) — 각 700 + 100 + 200 */
  --ok:#047857;      --ok-soft:#d1fae5;  --ok-line:#a7f3d0;
  --danger:#b91c1c;  --danger-soft:#fee2e2; --danger-line:#fecaca;
  --warn:#92400e;    --warn-soft:#fef3c7; --warn-line:#fde68a;
  --info:#0f766e;    --info-soft:#ccfbf1; --info-line:#99f6e4;
  --muted-soft:#ebeef5; --muted-line:#dcdfe6;
  /* 판정 불가 — 네 상태 색이 서로 달라야 칸을 따로 둔 뜻이 산다. 초록 · 빨강 · 회색 · 호박색과 겹치지 않는 파랑 */
  --unj:#1d4ed8;     --unj-soft:#dbeafe; --unj-line:#bfdbfe;

  /* method colors */
  --m-get:#0f766e;   --m-get-bg:#ccfbf1;
  --m-post:#047857;  --m-post-bg:#d1fae5;
  --m-patch:#92400e; --m-patch-bg:#fef3c7;
  --m-del:#b91c1c;   --m-del-bg:#fee2e2;

  /* json syntax */
  /* 보라(#7c3aed)·인디고(#1f3fa8)를 걷어내고 Forest Canopy 안에서만 구분한다 */
  --j-key:#2d4a2b;         /* primary-800 — 키는 구조라 가장 진하게 */
  --j-str:#0f766e;         /* info(teal) */
  --j-num:#92400e;         /* warning */
  --j-bool:#5b6350;        /* sage 계열 — olive(#a4ac86)는 흰 배경 2.1:1 이라 못 쓴다 */
  --j-null:var(--tx-3);
  --j-punc:#6b7280;
  --j-sentinel-bg:#ebeef5;
  --j-sentinel-tx:#606266;
  --j-pin-bg:#fef3c7;

  /* shadow */
  /* 테마 밖 하드코딩 색 승격 */
  --toast-icon:#34d399;
  --seg-tls:#7d8471;       /* sage — 타이밍 막대에서 accent 그린과 구분되는 유일한 보조색 */

  --sh-1:0 4px 16px rgba(0,0,0,.06);
  --sh-3:0 12px 48px rgba(0,0,0,.14);

  --focus:#457335;
  --split:40%;
  --split-v:45%;
  color-scheme:light;
}

    --bg-app:#141414;

    --warn:#fcd34d;    --warn-soft:#332708; --warn-line:#78350f;
    --info:#2dd4bf;    --info-soft:#123531; --info-line:#115e59;
    --muted-soft:#232323; --muted-line:#3a3b3d;

    --j-key:#9bc186;
    --j-str:#5eead4;
    --j-num:#fcd34d;

    --j-null:var(--tx-3);

    --j-sentinel-bg:#232323;

    --toast-icon:#047857;
    --seg-tls:#a4ac86;

    --sh-1:0 4px 16px rgba(0,0,0,.32);
    --sh-3:0 12px 48px rgba(0,0,0,.5);

    --focus:#9bc186;
    color-scheme:dark;
  }
}

  --accent-hover:#c2d9b3;

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font-ui); font-size:var(--fs-base);
  line-height:var(--lh-base); color:var(--tx-1); background:var(--bg-app);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
button,input,select,textarea{font:inherit; color:inherit}
button{background:none; border:0; cursor:pointer}
ul{list-style:none; margin:0; padding:0}
h1,h2,h3,h4{margin:0; font-weight:600; line-height:var(--lh-tight)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-xs)}
[hidden]{display:none!important}
::selection{background:var(--accent-soft); color:var(--tx-1)}


/* 시각 밀도는 유지하되 포인터 타깃을 44x44 이상으로 확장.
   원칙: .hit 은 흐름 배치(flow) 요소에만 쓴다. position:absolute 요소에 붙이면
   오버레이가 형제 요소(입력창 등)의 클릭 영역을 삼킨다. */
.hit{position:relative}
.hit::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:100%;min-width:44px;height:44px;
}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--font-mono); font-variant-ligatures:none}

/* scrollbars */
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:var(--r-full);border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--tx-3);background-clip:content-box;border:3px solid transparent}

/* ============================================================
   SHELL
   ============================================================ */
#app-shell-0d7{display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:minmax(0,1fr); width:100%; min-width:0; height:100vh}

/* ---------- TOP BAR ---------- */
#topbar-3f2{
  display:flex; align-items:center; gap:var(--s4);
  padding:0 var(--s4); height:56px; flex:0 0 auto;
  background:var(--bg-surface); border-bottom:1px solid var(--line);
  box-shadow:var(--sh-1); position:relative; z-index:40;
}
.brand{display:flex; align-items:center; gap:var(--s3); padding-right:var(--s4); min-width:0; flex:0 1 auto; overflow:hidden}
.brand-mark{
  width:30px;height:30px;border-radius:var(--r-md);flex:0 0 auto;
  background:linear-gradient(140deg,var(--accent),var(--seg-tls));
  display:grid;place-items:center;color:var(--on-solid);box-shadow:var(--sh-1)
}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-text b{font-size:var(--fs-md);font-weight:650;letter-spacing:-.01em}
.brand-text span{font-size:var(--fs-xs);color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.topbar-div{width:1px;height:28px;background:var(--line);flex:0 0 auto}
#sidebar-toggle-6e4{display:none;flex:0 0 auto}
.topbar-spacer{flex:1 1 auto}

/* env picker */
#env-picker-7c4{position:relative}
.env-btn{
  display:flex;align-items:center;gap:var(--s2);
  height:40px;min-height:40px;padding:0 var(--s2) 0 var(--s3);
  border:1px solid var(--line-strong);border-radius:var(--r-md);
  background:var(--bg-surface);transition:background var(--t-fast),border-color var(--t-fast),box-shadow var(--t-fast);
}
.env-btn:hover{background:var(--bg-hover);border-color:var(--tx-3)}
.env-btn:active{background:var(--bg-active)}
.env-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.env-dot{width:8px;height:8px;border-radius:var(--r-full);background:var(--ok);flex:0 0 auto}
.env-dot[data-env="stg"]{background:var(--warn)}
.env-dot[data-env="prod"]{background:var(--danger)}
.env-name{font-size:var(--fs-md);font-weight:600}
.env-url{font-size:var(--fs-xs);color:var(--tx-3);font-family:var(--font-mono)}
.env-menu{
  position:absolute;top:calc(100% + 6px);left:0;min-width:290px;z-index:60;
  background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);padding:var(--s1);
  opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none;visibility:hidden;
  transition:opacity var(--t-fast),transform var(--t-fast),visibility 0s linear 150ms;
}
.env-menu[data-open="true"]{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
.env-item{
  display:flex;align-items:center;gap:var(--s3);width:100%;
  min-height:44px;padding:var(--s2) var(--s3);border-radius:var(--r-md);
  text-align:left;transition:background var(--t-fast);
}
.env-item:hover{background:var(--bg-hover)}
.env-item[aria-checked="true"]{background:var(--bg-sel)}
.env-item .ei-main{flex:1 1 auto;min-width:0}
.env-item .ei-name{font-size:var(--fs-md);font-weight:600;display:flex;align-items:center;gap:var(--s2)}
.env-item .ei-url{font-size:var(--fs-xs);color:var(--tx-3);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* token meter */
#token-meter-b18{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s1);flex:0 1 auto;min-width:0}
.tm-body{display:flex;flex-direction:column;gap:3px;min-width:118px}
.tm-top{display:flex;align-items:baseline;gap:var(--s2)}
.tm-label{font-size:var(--fs-xs);color:var(--tx-3);letter-spacing:.02em}
.tm-time{font-size:var(--fs-md);font-weight:650;font-family:var(--font-mono);letter-spacing:-.02em}
.tm-track{height:4px;border-radius:var(--r-full);background:var(--bg-sunken);overflow:hidden}
.tm-fill{height:100%;border-radius:var(--r-full);background:var(--ok);transition:width 900ms linear,background var(--t-mid)}
.tm-low .tm-fill{background:var(--warn)}
.tm-low .tm-time{color:var(--warn)}

/* summary chips */
#verify-summary-5e0{display:flex;align-items:center;gap:var(--s1);flex:0 1 auto;min-width:0}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;
  border:1px solid var(--line);border-radius:var(--r-full);background:var(--bg-surface);
  font-size:var(--fs-sm);font-weight:600;color:var(--tx-2);
  transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast),transform var(--t-fast);
}
.chip:hover{background:var(--bg-hover);border-color:var(--line-strong)}
.chip:active{transform:scale(.97)}
.chip b{font-variant-numeric:tabular-nums;color:var(--tx-1)}
.chip[data-kind="pass"] svg{color:var(--ok)}
.chip[data-kind="fail"] svg{color:var(--danger)}
.chip[data-kind="pending"] svg{color:var(--tx-3)}
.chip[data-kind="unjudged"] svg{color:var(--unj)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--tx-1)}
.chip[aria-pressed="true"] b{color:var(--tx-1)}

/* icon buttons */
.icon-btn{
  width:36px;height:36px;min-width:36px;display:grid;place-items:center;
  border-radius:var(--r-md);border:1px solid transparent;color:var(--tx-2);
  transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast);
}
.icon-btn:hover{background:var(--bg-hover);color:var(--tx-1);border-color:var(--line)}
.icon-btn:active{background:var(--bg-active)}

/* ---------- MAIN GRID ---------- */
#main-8e4{position:relative; display:grid; grid-template-columns:296px minmax(0,1fr); min-width:0; min-height:0; overflow:hidden}

/* ---------- SIDEBAR ---------- */
#sidebar-c60{
  display:flex;flex-direction:column;min-height:0;
  /* park-golf AppSidebar 의 상단 primary 워시 — 단색 패널보다 위계가 읽힌다 */
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--accent) 9%, var(--bg-surface)) 0%,
    var(--bg-surface) 38%);
  border-right:1px solid var(--line);
}
#sidebar-scrim-4f7{display:none}
.side-head{padding:var(--s3) var(--s3) var(--s2)}
.kbd{
  display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;
  border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:var(--r-xs);
  background:var(--bg-surface);color:var(--tx-3);font-size:10px;font-family:var(--font-mono);font-weight:600;
}

.side-meta{display:flex;align-items:center;justify-content:space-between;padding:var(--s2) var(--s4) var(--s1);gap:var(--s2)}
.side-meta span{font-size:var(--fs-xs);color:var(--tx-3);letter-spacing:.04em;text-transform:uppercase;font-weight:650}
.link-btn{font-size:var(--fs-xs);color:var(--tx-3);padding:4px 6px;border-radius:var(--r-sm);transition:color var(--t-fast),background var(--t-fast)}
.link-btn:hover{color:var(--tx-1);background:var(--bg-hover)}
.link-btn[disabled]{cursor:not-allowed;opacity:.55}
.link-btn[disabled]:hover{color:var(--tx-3);background:none}

#endpoint-tree-a91{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:0 var(--s2) var(--s4)}
.grp{margin-bottom:2px}
.grp-btn{
  display:flex;align-items:center;gap:var(--s2);width:100%;min-height:36px;
  padding:var(--s1) var(--s2);border-radius:var(--r-sm);
  color:var(--tx-2);transition:background var(--t-fast),color var(--t-fast);
}
.grp-btn:hover{background:var(--bg-hover);color:var(--tx-1)}
.grp-btn[disabled]{cursor:not-allowed;opacity:.62}
.grp-btn[disabled]:hover{background:none;color:var(--tx-2)}
.grp-btn .chev{transition:transform var(--t-mid);color:var(--tx-3);flex:0 0 auto}
.grp-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.grp-name{font-size:var(--fs-md);font-weight:650;letter-spacing:-.005em;flex:1 1 auto;text-align:left}
.grp-count{font-size:var(--fs-xs);color:var(--tx-3);font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:var(--r-full);background:var(--bg-sunken)}
.grp-list{overflow:hidden}
.grp[data-open="false"] .grp-list{display:none}

.ep-btn{
  position:relative;display:flex;align-items:center;gap:var(--s2);width:100%;
  min-height:44px;padding:var(--s1) var(--s2) var(--s1) 26px;border-radius:var(--r-sm);
  text-align:left;transition:background var(--t-fast);
}
.ep-btn::before{
  content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;border-radius:2px;
  background:var(--line);transition:background var(--t-fast);
}
.ep-btn:hover{background:var(--bg-hover)}
.ep-btn:hover::before{background:var(--line-strong)}
.ep-btn:active{background:var(--bg-active)}

/* 메타 셀은 전부 같은 높이의 inline-flex 로 둔다.

   높이 고정이 없어 셀마다 크기가 달라지며, `+` 와 `−` 의 글리프 폭 차이가 배지 폭 차이로 드러난다. */
.j-type,.j-req,.j-note,.j-pin{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  height:18px;line-height:1;
}
.j-star{
  display:inline-flex;align-items:center;justify-content:center;width:10px;flex:0 0 auto;
  color:var(--danger);font-weight:700;margin-left:2px;
}
.j-row.clickable{cursor:pointer}
.j-row.clickable:hover{background:var(--bg-hover)}
.j-row.pinned{background:var(--j-pin-bg)}
.j-row.pinned:hover{background:var(--j-pin-bg);filter:brightness(.97)}
.j-ind{flex:0 0 auto;display:inline-block}
/* WCAG 2.2 AA 2.5.8 — 최소 24x24 타깃 */
.j-tog{
  width:24px;height:24px;flex:0 0 auto;display:grid;place-items:center;margin-right:2px;
  color:var(--j-punc);border-radius:var(--r-xs);transition:color var(--t-fast),background var(--t-fast),transform var(--t-mid);
}
.j-tog:hover{color:var(--tx-1);background:var(--bg-active)}
.j-tog svg{transition:transform var(--t-mid)}
.j-tog[aria-expanded="false"] svg{transform:rotate(-90deg)}
.j-key{color:var(--j-key)}
.j-punc{color:var(--j-punc)}
.j-str{color:var(--j-str)}
.j-num{color:var(--j-num)}
.j-bool{color:var(--j-bool)}
.j-null{color:var(--j-null)}
.j-preview{color:var(--j-punc);font-style:italic;margin:0 4px}
.j-pin{width:18px;color:var(--warn);margin-left:5px}
.j-sentinel{
  display:inline-flex;align-items:center;gap:5px;padding:0 7px;border-radius:var(--r-sm);
  background:var(--j-sentinel-bg);border:1px dashed var(--line-strong);color:var(--j-sentinel-tx);
  font-size:var(--fs-sm);font-style:normal;
}
.j-sentinel svg{opacity:.75}
.j-children{display:block}
.j-children[hidden]{display:none}

.json-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2);padding-top:var(--s2);padding-bottom:var(--s2);border-bottom:1px solid var(--line)}
.json-toolbar .spacer{flex:1 1 auto}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--tx-3)}
.legend .sw{width:11px;height:11px;border-radius:3px;border:1px dashed var(--line-strong);background:var(--j-sentinel-bg)}
.legend .sw.pin{background:var(--j-pin-bg);border:1px solid var(--warn-line)}
/* pin 칩은 경로만 보여주면 무슨 검사인지 알 수 없다 — 조건을 함께 싣는다 */
.pin-chip .pc-p{font-family:var(--font-mono)}
.pin-chip .pc-c{
  margin-left:6px;padding-left:6px;border-left:1px solid var(--warn-line);
  font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--tx-2);
}
.sch-cond{
  margin-left:6px;font-family:var(--font-ui);font-size:var(--fs-xs);
  color:var(--warn);white-space:nowrap;
}

/* ---------- DIFF ---------- */
#diff-list-c39{padding-top:var(--s4);padding-bottom:var(--s4)}
.diff-item{
  display:grid;grid-template-columns:auto 1fr;gap:var(--s3);align-items:start;
  padding:var(--s3);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:var(--s2);

}

.diff-item[data-k="rm"]  .diff-mark{color:var(--danger);background:var(--danger-soft);border-color:var(--danger-line)}
.diff-item[data-k="chg"] .diff-mark{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.diff-body{min-width:0}
.diff-top{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:3px}
.diff-kind{font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em}

.diff-item[data-k="rm"] .diff-kind{color:var(--danger)}
.diff-item[data-k="chg"] .diff-kind{color:var(--warn)}
.diff-path{font-family:var(--font-mono);font-size:var(--fs-md);font-weight:600;overflow-wrap:anywhere}
.diff-note{font-size:var(--fs-sm);color:var(--tx-2)}
.diff-note code{font-family:var(--font-mono);font-size:var(--fs-sm);padding:1px 5px;border-radius:var(--r-xs);background:var(--bg-sunken);border:1px solid var(--line)}
.arrow{color:var(--tx-3);margin:0 4px}

/* ---------- TIMING ---------- */
#timing-chart-70a{padding-top:var(--s5);padding-bottom:var(--s5)}
.tbar{display:flex;height:34px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);margin-bottom:var(--s4)}

.tlegend{display:flex;flex-direction:column;gap:0}
.tlrow{display:grid;grid-template-columns:14px 1fr auto auto;gap:var(--s3);align-items:center;padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.tlrow:last-child{border-bottom:0}
.tlsw{width:11px;height:11px;border-radius:3px}
.tlname{font-size:var(--fs-md);color:var(--tx-2)}
.tlval{font-family:var(--font-mono);font-size:var(--fs-md);font-weight:650;font-variant-numeric:tabular-nums}
.tlpct{font-size:var(--fs-xs);color:var(--tx-3);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}

/* ---------- FAIL REPORT ---------- */
#fail-report-e8c{padding-top:var(--s5);padding-bottom:var(--s5)}
.fail-hero{
  display:flex;gap:var(--s4);padding:var(--s4);border-radius:var(--r-lg);
  background:var(--danger-soft);border:1px solid var(--danger-line);margin-bottom:var(--s5);
}
.fail-icon{flex:0 0 auto;width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--danger);color:var(--on-solid)}

.viol{

  border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:var(--s2);background:var(--bg-surface);

.viol-n{

}
.viol h4{font-size:var(--fs-md);margin-bottom:var(--s1)}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--s3);align-items:center;margin-top:var(--s2)}
.cmp-box{padding:var(--s2) var(--s3);border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg-sunken)}
.cmp-box .cl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx-3);font-weight:700;display:block;margin-bottom:2px}
.cmp-box .cv{font-family:var(--font-mono);font-size:var(--fs-md);font-weight:650}
.cmp-box[data-t="exp"] .cv{color:var(--ok)}

.cmp-box[data-t="act"] .cv{color:var(--danger)}

/* ---------- EMPTY STATE ---------- */
/* #empty-state-3b6 = 미실행 전용 · #diff-empty-9c2 = 구조 변경 없음 전용 (식별자 분리) */

/* ---------- STATUS BAR ---------- */

  background:var(--bg-surface);border-top:1px solid var(--line);

/* ---------- TOAST ---------- */

  font-size:var(--fs-md);font-weight:600;

  transition:opacity var(--t-slow),transform var(--t-slow);
}

.pal__item{
  display:flex;align-items:center;gap:var(--s3);width:100%;min-height:44px;
  padding:var(--s2);border-radius:var(--r-md);border:1px solid transparent;
  text-align:left;color:var(--tx-2);cursor:pointer;
}
.pal__item[data-active="1"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--tx-1)}
.pal__item:hover{background:var(--bg-hover)}
.pal__item[data-active="1"]:hover{background:var(--accent-soft)}
.pal__label{font-family:var(--font-mono);font-size:var(--fs-md);color:var(--tx-1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal__label mark{background:var(--accent-soft);color:var(--accent);border-radius:2px;padding:0 1px}
.pal__grpname{font-size:var(--fs-xs);color:var(--tx-3);flex:none}
.pal__right{margin-left:auto;display:flex;align-items:center;gap:var(--s2);flex:none}
.pal__enter{opacity:0;font-size:var(--fs-xs);color:var(--tx-3)}
.pal__item[data-active="1"] .pal__enter{opacity:1}
.pal__foot{
  display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;
  padding:var(--s2) var(--s4);border-top:1px solid var(--line);
  background:var(--bg-sunken);font-size:var(--fs-xs);color:var(--tx-2);
}
.pal__foot span{display:inline-flex;align-items:center;gap:5px}
.pal__none{padding:var(--s8) var(--s4);text-align:center;color:var(--tx-2);font-size:var(--fs-md)}
.pal__none b{display:block;color:var(--tx-1);margin-bottom:var(--s1);font-family:var(--font-mono)}

/* ============================================================
   SCHEMA + INLINE DIFF  (응답 본문 트리에 병기)
   ============================================================ */
.diff-switch{
  display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;
  padding:0 var(--s2);border-radius:var(--r-md);color:var(--tx-2);
  font-size:var(--fs-sm);font-weight:600;cursor:pointer;
}
.diff-switch:hover{background:var(--bg-hover)}
/* park-golf .switch — h-6 w-11, thumb h-5 w-5, checked 는 gradient-primary */
.sw-track{
  position:relative;flex:none;width:44px;height:24px;border-radius:var(--r-full);
  background:var(--bg-sunken);border:1px solid var(--line-strong);
  transition:background var(--t-mid),border-color var(--t-mid);
}
.sw-thumb{
  position:absolute;top:1px;left:1px;width:20px;height:20px;border-radius:var(--r-full);
  background:var(--sw-thumb);box-shadow:0 2px 6px rgba(0,0,0,.28);
  transition:transform var(--t-mid);
}
.diff-switch[aria-checked="true"] .sw-track{
  background:linear-gradient(135deg, var(--accent-hover) 0%, var(--accent-lite) 100%);
  border-color:transparent;
}
.diff-switch[aria-checked="true"] .sw-thumb{transform:translateX(20px)}
.diff-switch[aria-checked="true"]{color:var(--tx-1)}

.j-gut{
  flex:0 0 auto;width:18px;text-align:center;
  font-family:var(--font-mono);font-weight:700;font-size:var(--fs-sm);
  color:var(--tx-3);user-select:none;
}
.j-gut[data-k="add"]{color:var(--ok)}
.j-gut[data-k="del"]{color:var(--danger)}
.j-gut[data-k="chg"]{color:var(--warn)}
#json-viewer-5d1[data-diff="off"] .j-gut{display:none}

.j-row--add{background:var(--ok-soft)}
.j-row--del{background:var(--danger-soft)}
.j-row--chg{background:var(--warn-soft)}
.j-row--add:hover,.j-row--del:hover,.j-row--chg:hover{filter:brightness(.97)}

.j-type{
  min-width:58px;justify-content:flex-end;
  font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--tx-3);
}
.j-req{
  margin-left:5px;min-width:32px;font-size:10px;font-weight:700;
  border:1px solid var(--line-strong);border-radius:var(--r-xs);padding:0 4px;
  color:var(--tx-3);
}
.j-req[data-r="y"]{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.j-req--none{border-color:transparent;background:none}
.j-note{
  margin-left:6px;min-width:22px;font-size:11px;font-weight:700;
  padding:0 6px;border-radius:var(--r-full);
  background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);
}
.j-note--add{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.j-note--del{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.j-note--none{background:none;border-color:transparent}
.j-ghost .j-key,.j-ghost .j-punc{text-decoration:line-through;opacity:.8}

function openEnvMenu(){
  const menu = $('#env-menu-6d3');
  menu.dataset.open = 'true';
  menu.removeAttribute('inert');
  $('#env-btn-1f5').setAttribute('aria-expanded','true');
  (menu.querySelector('.env-item[aria-checked="true"]') || menu.querySelector('.env-item'))?.focus();
}
function closeEnvMenu(){
  const menu = $('#env-menu-6d3');
  if (menu.dataset.open !== 'true' && menu.hasAttribute('inert')) return;
  menu.dataset.open = 'false';
  menu.setAttribute('inert','');
  $('#env-btn-1f5').setAttribute('aria-expanded','false');
}
/* role=menu 안에서의 방향키 이동 (WAI-ARIA Menu 패턴) */
$('#env-menu-6d3').addEventListener('keydown', e => {
  const items = $$('.env-item', e.currentTarget);
  if (!items.length) return;
  const i = items.indexOf(document.activeElement);
  let n = -1;
  if (e.key === 'ArrowDown') n = i < 0 ? 0 : (i + 1) % items.length;
  else if (e.key === 'ArrowUp') n = i < 0 ? items.length - 1 : (i - 1 + items.length) % items.length;
  else if (e.key === 'Home') n = 0;
  else if (e.key === 'End') n = items.length - 1;
  if (n < 0) return;
  e.preventDefault();
  items[n].focus();
});

/* 텍스트 검색은 팔레트가 맡는다 — 트리는 상태 필터만 본다 */
function matches(id){
  const d = EP[id];
  if (state.statusFilter && d.state !== state.statusFilter) return false;
  return true;
}

function renderTree(){
  const nav = $('#endpoint-tree-a91');
  let shown = 0;
  const forceOpen = false;   /* 검색이 팔레트로 빠지면서 강제 오픈 트리거가 사라졌다 */
  const html = GROUPS.map(g => {
    const eps = g.eps.filter(matches);
    shown += eps.length;
    if (!eps.length) return '';
    /* 강제 오픈은 검색어에만 한정한다 — 상태 필터는 항목을 거를 뿐 개폐를 강제하지 않는다 */
    const open = forceOpen ? true : state.openGroups[g.id];
    return `
    <div class="grp" data-grp="${g.id}" data-open="${open}">
      <button class="grp-btn" aria-expanded="${open}" data-grp-toggle="${g.id}"
        ${forceOpen ? 'disabled title="검색 중에는 모든 그룹이 펼쳐집니다"' : ''}>
        <span class="chev">${I.chevR}</span>
        <span class="grp-name">${g.name}</span>
        <span class="grp-count">${eps.length}</span>
      </button>
      <ul class="grp-list">
        ${eps.map(id => {
          const d = EP[id];
          const sel = id === state.selected;
          return `<li>
            <button class="ep-btn" data-ep="${id}" aria-current="${sel}">
              <span class="meth" data-m="${d.method}">${d.method}</span>
              <span class="ep-path"><bdi>${esc(d.path)}</bdi></span>
              <span class="st" data-s="${d.state}" title="${stText(d.state)}">${stIcon(d.state)}<span class="sr">${stText(d.state)}</span></span>
            </button></li>`;
        }).join('')}
      </ul>
    </div>`;
  }).join('');

  nav.innerHTML = html || `
    <div class="tree-empty">
      ${I.search}
      <div><b style="color:var(--tx-2)">일치하는 엔드포인트가 없습니다</b></div>
      <div style="margin-top:var(--s1);font-size:var(--fs-sm)">검색어나 상태 필터를 지워보세요.</div>
      <button class="btn btn-ghost btn-sm hit" id="reset-filter-btn-7e2" style="margin-top:var(--s4)">필터 초기화</button>
    </div>`;

  $('#tree-count-label-3a7').textContent = state.statusFilter
    ? `${shown} / ${EP_LIST.length} 표시` : `엔드포인트 ${EP_LIST.length}`;

  nav.querySelectorAll('[data-grp-toggle]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.grpToggle;
      /* 검색어는 건드리지 않는다 — 입력창 value 와 상태가 어긋나면 화면이 두 개의 답을 준다 */
      state.openGroups[id] = !(b.getAttribute('aria-expanded') === 'true');
      renderTree();
    });
  });
  nav.querySelectorAll('.ep-btn').forEach(b => {
    b.addEventListener('click', () => select(b.dataset.ep));
  });
  const rf = $('#reset-filter-btn-7e2');
  if (rf) rf.addEventListener('click', resetFilters);

  /* '모두 접기' 라벨은 이벤트가 아니라 상태에서 파생시킨다 */
  const anyOpen = GROUPS.some(g => state.openGroups[g.id]);
  const cb = $('#collapse-all-btn-8c4');
  cb.textContent = anyOpen ? '모두 접기' : '모두 펼치기';
  cb.setAttribute('aria-expanded', String(anyOpen));
  cb.disabled = forceOpen;
  cb.title = forceOpen ? '검색 중에는 모든 그룹이 펼쳐집니다' : '';
}

function resetFilters(){
  state.statusFilter=null;
  $$('#verify-summary-5e0 .chip').forEach(c=>c.setAttribute('aria-pressed','false'));
  renderTree();
}

function select(id){
  state.selected = id;
  state.reqTab = 'params';
  state.respTab = EP[id].state === 'fail' ? 'fail' : 'body';
  renderTree();
  renderWorkspace();
  $('#response-body-wrap-8d1').scrollTop = 0;
  /* renderTree 가 트리를 통째로 교체하므로 포커스 노드를 복원한다 — ↑↓ 이동이 1회용이 되지 않게 */
  $(`.ep-btn[data-ep="${id}"]`)?.focus({ preventScroll:true });
}

/* ============================================================
   WORKSPACE HEADER
   ============================================================ */
function contractBadge(c){
  if (c==='full')    return `<span class="badge" data-t="ok">계약 full</span>`;
  if (c==='partial') return `<span class="badge" data-t="warn">계약 partial</span>`;
  return `<span class="badge" data-t="muted">계약 없음</span>`;
}

function renderWorkspace(){
  const id = state.selected, d = EP[id];
  const env = ENVS.find(e=>e.id===state.env);
  const writeBlocked = env.ro && d.method !== 'GET';

  $('#ws-method-8e2').textContent = d.method;
  $('#ws-method-8e2').dataset.m = d.method;
  $('#ws-path-1c6').innerHTML = esc(d.path).replace(/\{(\w+)\}/g, '<span class="pp">{$1}</span>');
  $('#ws-sub-9d3').innerHTML = `
    <span class="mono">${esc(env.base)}</span>
    <span aria-hidden="true">·</span>
    <span class="mono">${esc(id)}</span>`;

  $('#ws-actions-5f8').innerHTML = `
    ${contractBadge(d.contract)}
    ${d.pins.length ? `<span class="badge" data-t="muted" title="추가 검사가 걸린 필드 수">${I.pin} 검사 ${d.pins.length}</span>` : ''}
    <span class="badge" data-t="${ST_TONE[d.state]}">

}

/* ============================================================

      ${extraOf(id).headers.map((row, i) => xrowHTML('header', i, row, '헤더 이름', '값')).join('')}
      <button type="button" class="add-btn hit" data-add="header">${I.plus}헤더 추가</button>
    </div>

        <div class="kv-row"><span class="kv-k">client_id</span><span class="kv-v">svc-dev</span><span></span></div>
        <div class="kv-row"><span class="kv-k">client_secret</span>
          <span class="kv-v"><span class="masked">${I.masked} ••••••••••••</span></span>

        <div class="kv-row"><span class="kv-k">scope</span>
          <span class="kv-v">orders:read orders:write products:read users:read</span><span></span></div>

    </div>
    <div class="callout" data-t="warn" style="margin-top:var(--s5)">${I.warn}
      <div><b>이 화면은 요청을 보내지 않습니다</b>
      브라우저에서 직접 호출하면 CORS 우회와 토큰 노출이 발생하므로, 실행은 항상 Claude 쪽 프로브가 담당합니다.</div></div>`;

  /* 탭 상태 (roving tabindex 포함) */
  $$('#request-tabs-9e7 .tab').forEach(t => {

/* 사용자가 더한 행 — 이름·값을 직접 친다. 픽스처 행과 달리 지울 수 있다. */
function xrowHTML(kind, i, row, phName, phVal){
  return `
    <div class="xrow" data-kind="${kind}" data-i="${i}">
      <input class="inp mono" data-x="n" value="${esc(row.n)}" placeholder="${phName}" spellcheck="false" aria-label="${phName}">
      <input class="inp mono" data-x="v" value="${esc(row.v)}" placeholder="${phVal}" spellcheck="false" aria-label="${phVal}">
      <button type="button" class="x-del hit" data-x="del" aria-label="이 행 삭제">${I.xmark}</button>

}

function fieldHTML(epId, pp, isPath){
  const v = valueOf(epId, pp.name, pp.value);
  const idAttr = `f-${epId.replace(/\./g,'-')}-${pp.name}`;
  let control;
  if (pp.type === 'enum'){
    control = `
      <div class="sel-wrap">
        <select class="inp" id="${idAttr}" data-pname="${pp.name}">
          ${pp.enum.map(o=>`<option value="${o}" ${o===v?'selected':''}>${o}</option>`).join('')}
        </select>
        ${I.chevSm}
      </div>
      <div class="enum-row">
        ${pp.enum.map(o=>`<button type="button" class="enum-pill hit" data-enum-for="${pp.name}" data-v="${o}" aria-pressed="${o===v}">${o}</button>`).join('')}
      </div>`;
  } else {
    control = `<input class="inp" id="${idAttr}" data-pname="${pp.name}" value="${esc(v)}"
      placeholder="${pp.value==='' ? '비어있음 — 첫 페이지' : ''}"
      inputmode="${pp.type==='integer'?'numeric':'text'}" spellcheck="false">`;
  }
  return `
    <div class="field">
      <label class="field-label" for="${idAttr}">
        <span class="fl-name">${esc(pp.name)}${isPath?'<span class="req" title="필수">*</span>':''}</span>
        <span class="fl-type">${pp.type}${pp.type==='enum'?` · ${pp.enum.length}`:''}</span>
      </label>
      <div class="control">
        ${control}
        <span class="field-hint">${esc(pp.desc)}</span>
      </div>
    </div>`;
}

/* 추가 행의 입력·삭제·생성. 구조가 바뀌는 조작(추가/삭제)만 재렌더하고,
   타이핑은 state 만 갱신해 커서가 튀지 않게 한다. */
function bindExtras(root, d, id, writeBlocked){
  const xt = extraOf(id);
  const redraw = () => renderRequest(d, id, writeBlocked);

  root.querySelectorAll('[data-add]').forEach(b => {
    b.addEventListener('click', () => {
      const k = b.dataset.add;
      if (k === 'param')       xt.params.push({ n:'', v:'' });
      else if (k === 'header') xt.headers.push({ n:'', v:'' });
      else if (k === 'body')   xt.body = '{\n  \n}';
      else if (k === 'body-remove') xt.body = null;
      redraw(); renderCommand();
      const sel = k === 'body' ? '#req-body-input-2c7'
                : k === 'body-remove' ? '[data-add="body"]'
                : `.xrow[data-kind="${k}"]:last-of-type [data-x="n"]`;
      const el = (k === 'header' ? $('#header-table-e51') : root).querySelector(sel) || $(sel);
      if (el) el.focus();
    });
  });

  root.querySelectorAll('.xrow').forEach(rowEl => {
    const kind = rowEl.dataset.kind, i = Number(rowEl.dataset.i);
    const list = kind === 'param' ? xt.params : xt.headers;
    rowEl.querySelectorAll('[data-x="n"],[data-x="v"]').forEach(inp => {
      inp.addEventListener('input', () => { list[i][inp.dataset.x] = inp.value; renderCommand(); });
    });
    rowEl.querySelector('[data-x="del"]').addEventListener('click', () => {
      list.splice(i, 1); redraw(); renderCommand();
    });
  });
}

/* ============================================================
   COMMAND BUILDER
   ============================================================ */
/* 본문의 단일 진실 공급원은 DOM 이 아니라 state 다 */
function bodyText(id, d){
  return valueOf(id, '__body', JSON.stringify(d.reqBody, null, 2));
}

/* read-only 차단은 여기 한 곳에서만 판단한다 — 복사 경로가 몇 개든 전부 이 문을 지난다 */
function buildCommand(){
  const id = state.selected, d = EP[id];
  const env = ENVS.find(e => e.id === state.env);
  if (env.ro && d.method !== 'GET') return null;

  const parts = [`/api-probe ${id}`];
  if (state.env !== 'dev') parts.push(`--env ${state.env}`);
  d.pathParams.forEach(pp => {
    const v = valueOf(id, pp.name, pp.value);
    if (v !== '') parts.push(`--path ${pp.name}=${v}`);
  });
  d.params.forEach(pp => {
    const v = valueOf(id, pp.name, pp.value);
    if (v !== '') parts.push(`--query ${pp.name}=${v}`);
  });
  const xt = extraOf(id);
  xt.params.filter(x => x.n.trim()).forEach(x => parts.push(`--query ${x.n.trim()}=${x.v}`));
  xt.headers.filter(x => x.n.trim()).forEach(x => parts.push(`--header '${x.n.trim()}: ${x.v}'`));

  const rawBody = d.reqBody ? bodyText(id, d) : xt.body;
  if (rawBody !== null && rawBody !== undefined){
    let compact;
    try { compact = JSON.stringify(JSON.parse(rawBody)); }
    catch(e){ compact = null; }
    parts.push(compact ? `--body '${compact}'` : `--body <JSON 구문 오류>`);
  }
  if (d.state === 'pending') parts.push('--record');
  return parts.join(' ');
}

const CMD_BLOCKED_MSG = 'prod 프로파일에서는 쓰기 메서드를 복사할 수 없습니다';

/* 복사 경로는 이 함수 하나뿐 */
function copyCommand(btn){
  const cmd = buildCommand();
  if (cmd === null){ toast(CMD_BLOCKED_MSG); return; }
  copyText(cmd, btn);
}

let cmdStatusTimer;
function renderCommand(){
  const cmd = buildCommand();
  const cc = $('#cmd-code-7b3');
  if (cmd === null){
    cc.innerHTML = `<span class="cmd-blocked">${esc(CMD_BLOCKED_MSG)}</span>`;
    cc.dataset.raw = '';
  } else {
    cc.innerHTML = esc(cmd)
      .replace(/^(\/api-probe)(\s+)(\S+)/, '<span class="c-cmd">$1</span>$2<span class="c-val">$3</span>')
      .replace(/(--[a-z]+)(\s)/g, '<span class="c-flag">$1</span>$2');
    cc.dataset.raw = cmd;
  }
  /* 잘림 여부를 시각 신호로 노출 */
  $('#cmd-code-wrap-9a2').dataset.clipped = String(cc.scrollHeight > cc.clientHeight + 1);
  /* 전문을 매 타자마다 낭독하지 않는다 — 변경 사실만 디바운스로 알린다 */
  clearTimeout(cmdStatusTimer);
  cmdStatusTimer = setTimeout(() => { $('#cmd-status-3e8').textContent = '커맨드 갱신됨'; }, 300);
}

/* ============================================================
   RESPONSE PANE
   ============================================================ */
function renderResponse(d, writeBlocked){
  const tabsEl = $('#response-tabs-af4');
  const wrap = $('#response-body-wrap-8d1');

  if (d.state === 'pending'){
    state.respTab = 'empty';
    tabsEl.innerHTML = respTabHTML({ k:'empty', label:'상태' }, true);
    wrap.innerHTML = `<div class="tabpanel flush" id="rp-empty" role="tabpanel" aria-labelledby="rtab-empty"
      data-rpanel="empty" data-active="true">${emptyStateHTML(d, writeBlocked)}</div>`;
    bindRespTabs();
    return;
  }

  const tabs = [];
  if (d.state === 'fail') tabs.push({ k:'fail', label:'실패 원인', dot:true });
  tabs.push({ k:'body',    label:'본문' });
  tabs.push({ k:'headers', label:'헤더' });
  tabs.push({ k:'timing',  label:'타이밍' });
  /* 구조 diff 탭 제거 — 같은 정보를 본문 트리가 인라인으로 이미 보여준다.
     탭을 남기면 사용자가 두 곳을 번갈아 보게 되고, 어느 쪽이 정본인지 흐려진다. */

  if (!tabs.some(t => t.k === state.respTab)) state.respTab = tabs[0].k;

  tabsEl.innerHTML = tabs.map(t => respTabHTML(t, t.k === state.respTab)).join('');

  const ok = d.resp.code < 400;
  const strip = `
    <div class="resp-strip">
      <span class="stat-pill" data-t="${ok?'ok':'danger'}">
        ${ok?I.pass:I.fail} ${d.resp.code} ${d.resp.text}
      </span>
      ${!ok ? `<span class="badge" data-t="muted">기대 ${d.resp.expected}</span>` : ''}
      <span class="metric sep-before"><span class="mv">${d.resp.ms}ms</span><span class="mk">응답 시간</span></span>
      <span class="metric"><span class="mv">${d.resp.size}</span><span class="mk">본문 크기</span></span>
      <span class="metric"><span class="mv" style="font-size:var(--fs-sm)">application/json</span><span class="mk">content-type</span></span>
      <span class="metric sep-before"><span class="mv" style="font-size:var(--fs-sm)">12분 전</span><span class="mk">캡처 시각</span></span>
    </div>

/* 줄바꿈 감지 — 행의 첫 칸이 된 구분선은 떼어낸다 */
let stripRO;
function syncStripSeps(strip){
  if (!strip) return;
  /* 셀 높이가 제각각이고 align-items:center 라 offsetTop 은 행 판정에 못 쓴다 — 중심선으로 비교한다 */
  const midY = el => { const r = el.getBoundingClientRect(); return r.top + r.height / 2; };
  const apply = () => strip.querySelectorAll('.sep-before').forEach(el => {
    const prev = el.previousElementSibling;
    el.dataset.rowStart = String(!prev || Math.abs(midY(el) - midY(prev)) > 2);
  });
  apply();
  stripRO?.disconnect();
  stripRO = new ResizeObserver(apply);
  stripRO.observe(strip);
}

/* WAI-ARIA Tabs 패턴 — ArrowLeft/Right(및 Up/Down) 로 인접 탭 이동, Home/End 로 양끝 */
function bindTablistKeys(listSel, activate){
  $(listSel).addEventListener('keydown', e => {
    const tabs = $$('.tab', e.currentTarget);
    const i = tabs.indexOf(document.activeElement);
    if (i === -1) return;
    let n = -1;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') n = (i + 1) % tabs.length;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End') n = tabs.length - 1;
    if (n < 0) return;
    e.preventDefault();
    tabs[n].focus();
    activate(tabs[n]);
  });
}

/* ============================================================
   JSON VIEWER
   ============================================================ */
function plain(v){
  if (v && typeof v === 'object'){
    if (v.__s) return v.__s;
    if (Array.isArray(v)) return v.map(plain);
    const o = {}; for (const k in v) o[k] = plain(v[k]); return o;
  }
  return v;
}
const isSentinel = v => v && typeof v === 'object' && '__s' in v;
const isBranch = v => v && typeof v === 'object' && !isSentinel(v);

function scalarHTML(v){
  if (isSentinel(v)) return `<span class="j-sentinel" title="${esc(v.hint)}">${I.norm}${esc(v.__s)}</span>`;
  /* 긴 문자열은 열 폭에 맞춰 말줄임된다 — 전문을 title 로 남겨야 읽을 길이 생긴다.
     실측: auth.token 의 $.scope 51자가 1280px 에서 잘렸다 (평가자 지적) */
  if (typeof v === 'string')  return `<span class="j-str" title="${esc(v)}">"${esc(v)}"</span>`;
  if (typeof v === 'number')  return `<span class="j-num">${v}</span>`;
  if (typeof v === 'boolean') return `<span class="j-bool">${v}</span>`;
  if (v === null)             return `<span class="j-null">null</span>`;
  return esc(String(v));
}

/* 스키마 타입은 실제 값에서 유도한다 — 블랙박스 킷의 계약은 응답이 SSOT 다 */
function schemaType(v){
  if (isSentinel(v))          return 'string';
  if (Array.isArray(v))       return 'array';
  if (v === null)             return 'null';
  if (typeof v === 'object')  return 'object';
  if (typeof v === 'number')  return Number.isInteger(v) ? 'integer' : 'number';
  return typeof v;
}

const GUT_SYM   = { add:'+', del:'−', chg:'~' };
const GUT_LABEL = { add:'추가된 필드', del:'제거된 필드', chg:'변경된 필드' };

function gutHTML(kind){
  return kind
    ? `<span class="j-gut" data-k="${kind}" title="${GUT_LABEL[kind]}">${GUT_SYM[kind]}</span>`
    : '<span class="j-gut" aria-hidden="true"></span>';
}

/* 행에는 타입 하나만 둔다. 설명·필수·변경 열까지 넣었더니 1280px 에서 값이 통째로 잘렸다
   (실측: `"orderId":"or…`) — 그 열들은 아래 데이터 구조 표에만 있다. */
function typeHTML(ctx, path, value, forced){
  const sc = ctx.schema[path];
  const t = forced || (sc && sc.t) || schemaType(value);
  /* 필수 필드는 타입 옆 빨간 별 하나로 표시한다 — 경로 파라미터의 `.req` 와 같은 규약이다.
     별은 장식이 아니므로 aria-hidden 하지 않고 title 로 읽히게 둔다. */
  const star = (sc && sc.req === true) ? '<span class="j-star" title="필수">*</span>' : '';
  return `<span class="j-type">${esc(t)}${star}</span>`;
}

/* 변경 요약 — 픽스처 note 의 <code> 두 개를 뽑아 "string → number" 로 줄인다 */
function chgSummary(entry){
  const m = (entry && entry.note || '').match(/<code>([^<]+)<\/code>/g);
  if (m && m.length >= 2) return m.slice(0,2).map(x => x.replace(/<\/?code>/g,'')).join(' → ');
  return '변경됨';
}

/* 추가·제거는 기호 하나로 줄인다. 낱말은 좁은 폭에서 값을 밀어내고, 좌측 거터와 같은 말을
   두 번 하는 셈이다. 변경(chg)만 `string → number` 처럼 내용이 있어 낱말을 유지한다.
   기호만 남기면 스크린리더가 "플러스" 로 읽으므로 title 로 뜻을 남긴다. */
function noteHTML(ctx, path, kind){
  if (!kind) return '';
  if (kind === 'add') return `<span class="j-note j-note--add" title="${GUT_LABEL.add}">+</span>`;
  if (kind === 'del') return `<span class="j-note j-note--del" title="${GUT_LABEL.del}">−</span>`;
  return `<span class="j-note">${esc(chgSummary(ctx.dmap.chg[path]))}</span>`;
}

/* diff 픽스처를 경로 조회용으로 뒤집는다. rm 은 응답에 노드가 없으므로
   부모 경로에 매달아 두었다가 유령 행으로 되살린다. */
/* pin 된 필드가 구조 변경에 걸린 경우에만 본문 위에 경고를 세운다.
   (구조 diff 탭이 사라지면서 이 경고가 갈 곳이 없어졌다) */
function pinBreakHTML(d){
  if (!state.diffOn) return '';
  const broken = (d.diff || []).filter(x => x.k === 'chg');
  if (!broken.length) return '';
  const paths = broken.map(x => `<span class="mono">${esc(x.path)}</span>`).join(', ');
  /* 타입 변경은 pin 이 아니라 기본 검사에서 이미 실패한다 — 원인을 정확히 적는다 */
  const alsoPinned = broken.filter(x => pinOf(d, x.path));
  const extra = alsoPinned.length
    ? ` 이 필드에는 <span class="em">추가 검사</span>(${alsoPinned.map(x=>esc(pinOf(d,x.path).c)).join(', ')})도 걸려 있어 함께 다시 봐야 합니다.`
    : '';
  return `<div class="callout" data-t="warn" style="margin:var(--s4) 0">${I.warn}
    <div><b>계약 갱신이 필요합니다</b>
    ${paths} 의 타입이 바뀌었습니다 — 기본 검사(존재·타입)에서 실패합니다.${extra}
    <span class="mono">/api-contract accept ${esc(state.selected)}</span> 로 새 구조를 받아들이거나, 서버 쪽을 되돌리세요.</div></div>`;
}

/* 응답에서 스칼라 경로를 순서대로 훑어 스키마 행을 만든다.
   타입은 값에서 유도하고, 필수 여부·설명은 SCHEMA 픽스처가 출처다.
   응답에 없지만 계약이 아는 필드(removed)는 뒤에 붙인다. */
function schemaRows(d, epId){
  const defs = SCHEMA[epId] || {};
  const rows = [], seen = new Set();
  const walk = (val, path) => {
    if (isBranch(val)){
      const arr = Array.isArray(val);
      const entries = arr ? val.map((v,i)=>[i,v]) : Object.entries(val);
      entries.forEach(([k,v]) => walk(v, arr ? `${path}[]` : `${path}.${k}`));
      return;
    }
    if (seen.has(path)) return;
    seen.add(path);
    const sc = defs[path];
    rows.push({ path, t:(sc && sc.t) || schemaType(val), req: sc ? sc.req : null, d: sc ? sc.d : '' });
  };
  if (d.body) walk(d.body, '$');
  Object.keys(defs).forEach(p => {
    if (seen.has(p) || !defs[p].removed) return;
    seen.add(p);
    rows.push({ path:p, t:defs[p].t || 'unknown', req:defs[p].req, d:defs[p].d, removed:true });
  });
  return rows;
}

function schemaTableHTML(d, epId){
  const rows = schemaRows(d, epId);
  if (!rows.length) return '';
  const dm = diffIndex(d.diff);
  const kindOf = p => dm.add[p] ? 'add' : dm.chg[p] ? 'chg' : (rows.find(r=>r.path===p)||{}).removed ? 'del' : '';
  const documented = rows.filter(r => r.d).length;
  return `
    <div class="sec" id="schema-table-4b1">
      <div class="sec-head">
        <h3 class="sec-title">데이터 구조</h3>
        <span class="sec-note">필드 ${rows.length}개 · 설명 ${documented}개</span>
      </div>
      <div class="tbl-head" data-for="schema"><span>필드</span><span>타입</span><span>필수</span><span>설명</span></div>
      ${rows.map(r => {
        const k = state.diffOn ? kindOf(r.path) : '';
        const pin = pinOf(d, r.path);
        return `<div class="sch-row"${k?` data-k="${k}"`:''}>
          <span class="sch-path">${k?`<span class="sch-mark">${GUT_SYM[k]}</span>`:''}${esc(r.path)}${pin?`<span class="j-pin" title="추가 검사 — ${esc(pin.c)}">${I.pin}</span><span class="sch-cond">${esc(pin.c)}</span>`:''}</span>
          <span class="sch-type">${esc(r.t)}</span>
          <span class="sch-req">${r.req === null ? '<span class="sch-dash">—</span>' : `<span class="j-req" data-r="${r.req?'y':'n'}">${r.req?'필수':'옵션'}</span>`}</span>
          <span class="sch-desc">${r.d ? esc(r.d) : '<span class="sch-dash">설명 없음</span>'}</span>
        </div>`;
      }).join('')}
    </div>`;
}

function diffIndex(diff){
  const idx = { add:{}, chg:{}, ghosts:{} };
  (diff || []).forEach(x => {
    if (x.k === 'add') idx.add[x.path] = x;
    else if (x.k === 'chg') idx.chg[x.path] = x;
    else if (x.k === 'rm'){
      const i = x.path.lastIndexOf('.');
      const parent = x.path.slice(0, i), key = x.path.slice(i + 1);
      (idx.ghosts[parent] = idx.ghosts[parent] || []).push({ key, path:x.path });
    }
  });
  return idx;
}

function renderJSON(value, epId, pins, diff, diffOn){
  const ctx = {
    pins,
    schema: SCHEMA[epId] || {},
    dmap: diffIndex(diff),
    diffOn
  };
  const frag = document.createDocumentFragment();
  frag.appendChild(buildNode(null, value, 0, '$', ctx, true));
  return frag;
}

const J_TOG_W = 26;   /* .j-tog 24px + margin 2px — 스칼라/닫는 행 정렬 오프셋 */

function buildNode(key, value, depth, path, ctx, isLast){
  const pad = depth * 18;
  const keyHTML = key === null ? '' : `<span class="j-key">"${esc(key)}"</span><span class="j-punc">: </span>`;
  const pinned = ctx.pins.some(x => x.p === path);
  const pinCond = pinned ? ctx.pins.find(x => x.p === path).c : '';
  const pinHTML = pinned ? `<span class="j-pin" title="추가 검사 — ${esc(path)} ${esc(pinCond)}">${I.pin}</span>` : '';
  /* diff 가 꺼져 있으면 종류 자체를 계산하지 않는다 — 마크도 유령 행도 생기지 않는다 */
  const kind = !ctx.diffOn ? '' : (ctx.dmap.add[path] ? 'add' : ctx.dmap.chg[path] ? 'chg' : '');
  const kindCls = kind ? ' j-row--' + kind : '';

  if (!isBranch(value)){
    const row = document.createElement('div');
    row.className = 'j-row' + (pinned ? ' pinned' : '') + kindCls;
    row.dataset.path = path;
    row.innerHTML = gutHTML(kind)
      + `<span class="j-code"><span class="j-ind" style="width:${pad+J_TOG_W}px"></span>${keyHTML}${scalarHTML(value)}${isLast?'':'<span class="j-punc">,</span>'}</span>`
      + `<span class="j-meta">${typeHTML(ctx, path, value)}${noteHTML(ctx, path, kind)}${pinHTML}</span>`;
    return row;
  }

  const arr = Array.isArray(value);
  const open = arr ? '[' : '{';
  const close = arr ? ']' : '}';
  const entries = arr ? value.map((v,i)=>[i,v]) : Object.entries(value);
  const preview = arr ? `${entries.length}개 항목` : `${entries.length}개 키`;

  const node = document.createElement('div');
  node.className = 'j-node';

  const head = document.createElement('div');
  head.className = 'j-row clickable' + (pinned ? ' pinned' : '') + kindCls;
  head.dataset.path = path;
  head.innerHTML =
    gutHTML(kind) +
    `<span class="j-code">` +
      `<span class="j-ind" style="width:${pad}px"></span>` +
      `<button class="j-tog" aria-expanded="true" aria-label="${key===null?'루트':esc(String(key))} 접기/펼치기">${I.chevSm}</button>` +
      keyHTML +
      `<span class="j-punc">${open}</span>` +
      `<span class="j-preview" hidden>… ${preview} </span>` +
      `<span class="j-punc j-inline-close" hidden>${close}${isLast?'':','}</span>` +
    `</span>` +
    `<span class="j-meta">${typeHTML(ctx, path, value)}${noteHTML(ctx, path, kind)}${pinHTML}</span>`;

  const children = document.createElement('div');
  children.className = 'j-children';
  const ghosts = ctx.diffOn ? (ctx.dmap.ghosts[path] || []) : [];
  entries.forEach(([k,v],i) => {
    const childPath = arr ? `${path}[]` : `${path}.${k}`;
    const last = i === entries.length-1 && !ghosts.length;
    children.appendChild(buildNode(arr ? null : k, v, depth+1, childPath, ctx, last));
  });
  /* 유령 행 — 직전 스냅샷에는 있었으나 이번 응답에서 사라진 필드.
     계약이 아는 필드이므로 스키마 표기를 그대로 달아 준다. */
  ghosts.forEach((g, gi) => {
    const row = document.createElement('div');
    row.className = 'j-row j-row--del j-ghost';
    row.dataset.path = g.path;
    row.innerHTML = gutHTML('del')
      + `<span class="j-code">`
      +   `<span class="j-ind" style="width:${(depth+1)*18+J_TOG_W}px"></span>`
      +   `<span class="j-key">"${esc(g.key)}"</span><span class="j-punc">: </span>`
      +   `<span class="j-null">없음</span>${gi === ghosts.length-1 ? '' : '<span class="j-punc">,</span>'}`
      + `</span>`
      + `<span class="j-meta">${typeHTML(ctx, g.path, null)}${noteHTML(ctx, g.path, 'del')}</span>`;
    children.appendChild(row);
  });

  const closer = document.createElement('div');
  closer.className = 'j-row j-closer';
  closer.innerHTML = gutHTML('') +
    `<span class="j-code"><span class="j-ind" style="width:${pad+J_TOG_W}px"></span><span class="j-punc">${close}${isLast?'':','}</span></span>`;

  node.append(head, children, closer);

  const tog = head.querySelector('.j-tog');
  const toggle = () => {
    const nowOpen = tog.getAttribute('aria-expanded') !== 'true';
    tog.setAttribute('aria-expanded', String(nowOpen));
    children.hidden = !nowOpen;
    closer.hidden = !nowOpen;
    head.querySelector('.j-preview').hidden = nowOpen;
    head.querySelector('.j-inline-close').hidden = nowOpen;
  };
  /* 행 클릭은 마우스 편의일 뿐이고, 접근성 컨트롤은 24x24 .j-tog 버튼이다 */
  head.addEventListener('click', e => { e.stopPropagation(); toggle(); });
  tog.addEventListener('click', e => { e.stopPropagation(); toggle(); });
  return node;
}

function setAllNodes(root, open){

    const tog = n.querySelector(':scope > .j-row > .j-tog');

let toastTimer;
function toast(msg){
  const t = $('#toast-44a');
  t.innerHTML = `${I.check}<span>${esc(msg)}</span>`;
  t.dataset.show = 'true';
  clearTimeout(toastTimer);

function copyText(text, btn){
  const done = () => {
    toast('클립보드에 복사했습니다');
    if (btn){
      const label = btn.querySelector('span') || btn;
      const orig = label.innerHTML;
      btn.classList.add('done');
      label.innerHTML = '복사됨';
      setTimeout(() => { btn.classList.remove('done'); label.innerHTML = orig; }, 1600);
    }
  };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); }
  catch(e){ toast('복사 실패 — 직접 선택해 주세요'); }
  document.body.removeChild(ta);
}

/* ============================================================
   RESIZER
   ============================================================ */
(function initResizer(){
  const rz = $('#pane-resizer-b73'), panes = $('#panes-b02');
  const stacked = window.matchMedia('(max-width:880px)');
  const isV = () => stacked.matches;
  const cur = () => isV() ? state.splitV : state.split;

  /* 880px 이하에서는 세로 분할이므로 --split-v 를 쓴다 — 축과 상태가 어긋나지 않게 */
  const apply = pct => {
    if (isV()){
      state.splitV = Math.min(75, Math.max(25, pct));
      document.documentElement.style.setProperty('--split-v', state.splitV + '%');
    } else {
      state.split = Math.min(72, Math.max(28, pct));
      document.documentElement.style.setProperty('--split', state.split + '%');
    }
    rz.setAttribute('aria-valuenow', Math.round(cur()));
  };
  const syncAxis = () => {
    const v = isV();
    rz.setAttribute('aria-orientation', v ? 'horizontal' : 'vertical');
    rz.setAttribute('aria-label', v
      ? '요청/응답 패널 높이 조절 (위아래 방향키, 더블클릭으로 초기화)'
      : '요청/응답 패널 너비 조절 (좌우 방향키, 더블클릭으로 초기화)');
    rz.setAttribute('aria-valuemin', v ? 25 : 28);
    rz.setAttribute('aria-valuemax', v ? 75 : 72);
    rz.setAttribute('aria-valuenow', Math.round(cur()));
    document.body.dataset.dragAxis = v ? 'v' : 'h';
  };

  let dragging = false;
  rz.addEventListener('pointerdown', e => {
    dragging = true; document.body.dataset.dragging = 'true';
    rz.setPointerCapture(e.pointerId);
  });
  rz.addEventListener('pointermove', e => {
    if (!dragging) return;
    const r = panes.getBoundingClientRect();
    apply(isV() ? (e.clientY - r.top) / r.height * 100
                : (e.clientX - r.left) / r.width * 100);
  });
  const stop = e => {
    if (!dragging) return;
    dragging = false; document.body.dataset.dragging = 'false';
    try { rz.releasePointerCapture(e.pointerId); } catch(_){}
  };
  rz.addEventListener('pointerup', stop);
  rz.addEventListener('pointercancel', stop);
  rz.addEventListener('dblclick', () => apply(isV() ? 45 : 46));
  rz.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ apply(cur() - 2); e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){ apply(cur() + 2); e.preventDefault(); }
    if (e.key === 'Home'){ apply(isV() ? 45 : 46); e.preventDefault(); }
  });
  stacked.addEventListener('change', syncAxis);
  syncAxis();
})();

(function initToken(){

    tr.setAttribute('aria-valuenow', left);
    tr.setAttribute('aria-valuetext', left === 0 ? '토큰 만료됨' : text);

   ============================================================ */
function fuzzy(q, text){
  q = q.toLowerCase().replace(/\s+/g,'');
  const t = text.toLowerCase();
  if (!q) return { ok:true, score:0, hits:[] };
  let ti = 0, score = 0, last = -2;
  const hits = [];
  for (let i = 0; i < q.length; i++){
    const idx = t.indexOf(q[i], ti);
    if (idx < 0) return { ok:false, score:0, hits:[] };
    hits.push(idx);
    score += (idx === last + 1) ? 4 : 1;
    if (idx === 0) score += 3;
    last = idx; ti = idx + 1;
  }
  return { ok:true, score, hits };
}
function hl(text, hits){
  if (!hits || !hits.length) return esc(text);
  const set = {}; hits.forEach(i => set[i] = 1);
  let out = '';
  for (let i = 0; i < text.length; i++) out += set[i] ? `<mark>${esc(text[i])}</mark>` : esc(text[i]);
  return out;
}

const SCOPES = [
  { id:'fail',   label:'실패한 엔드포인트만' },
  { id:'recent', label:'최근 실행' },
  { id:'pin',    label:'추가 검사가 걸린 엔드포인트' },
  { id:'help',   label:'단축키 도움말' }
];
const SCOPE_NAMES = { fail:'실패', recent:'최근 실행', pin:'추가 검사', help:'단축키' };

const ACTIONS = [
  { id:'a-copy',  label:'프로브 커맨드 복사',   run:() => $('#copy-cmd-btn-4e1').click() },
  { id:'a-theme', label:'테마 전환 라이트/다크', run:() => $('#theme-toggle-2d9').click() },
  { id:'a-diff',  label:'변경 표시 토글',       run:() => { const b = $('#diff-switch-7c2'); if (b) b.click(); } },
  { id:'a-dev',   label:'환경 전환 dev',        run:() => setEnv('dev') },
  { id:'a-stg',   label:'환경 전환 stg',        run:() => setEnv('stg') },
  { id:'a-prod',  label:'환경 전환 prod',       run:() => setEnv('prod') },
  { id:'a-fold',  label:'그룹 모두 접기',       run:() => $('#collapse-all-btn-8c4').click() },
  { id:'a-reset', label:'필터 초기화',          run:() => resetFilters() }
];

function palPool(scope){
  if (scope === 'fail')   return EP_LIST.filter(x => x.d.state === 'fail');
  if (scope === 'recent') return RECENT_IDS.map(id => EP_LIST.find(x => x.id === id)).filter(Boolean);
  if (scope === 'pin')    return EP_LIST.filter(x => (x.d.pins || []).length);
  return EP_LIST.slice();
}

function palRows(){
  const q = $('#palette-input-k08').value.trim();
  const scope = state.palScope;
  const rows = [];

  if (scope === 'help'){
    const keys = HELP_KEYS.filter(k => !q || fuzzy(q, k[1]).ok || fuzzy(q, k[0]).ok);
    rows.push({ type:'sec', label:`단축키 ${keys.length}` });
    keys.forEach(k => rows.push({ type:'help', k:k[0], label:k[1] }));
    return rows;
  }

  const pool = palPool(scope);

  if (q){
    const scored = [];
    pool.forEach(x => {
      const whole = fuzzy(q, x.d.method + ' ' + x.d.path);
      const ident = fuzzy(q, x.id);
      if (!whole.ok && !ident.ok) return;
      const onPath = fuzzy(q, x.d.path);
      scored.push({ x, score:(whole.ok ? whole.score : 0) + (ident.ok ? ident.score : 0), hits:onPath.ok ? onPath.hits : null });
    });
    scored.sort((a,b) => b.score - a.score);
    const acts = ACTIONS.filter(a => fuzzy(q, a.label).ok);
    if (scored.length){
      rows.push({ type:'sec', label:`엔드포인트 ${scored.length}` });
      scored.forEach(sc => rows.push({ type:'ep', x:sc.x, hits:sc.hits }));
    }
    if (acts.length){
      rows.push({ type:'sec', label:`액션 ${acts.length}` });
      acts.forEach(a => rows.push({ type:'act', a }));
    }
    return rows;
  }

  if (scope){
    rows.push({ type:'sec', label:`${SCOPE_NAMES[scope]} ${pool.length}` });
    pool.forEach(x => rows.push({ type:'ep', x, hits:null }));
    return rows;
  }

  const fails = EP_LIST.filter(x => x.d.state === 'fail');
  if (fails.length){
    rows.push({ type:'sec', label:`실패 ${fails.length}` });
    fails.forEach(x => rows.push({ type:'ep', x, hits:null }));
  }
  rows.push({ type:'sec', label:'스코프' });
  SCOPES.forEach(sc => rows.push({ type:'scope', sc }));
  rows.push({ type:'sec', label:'액션' });
  ACTIONS.forEach(a => rows.push({ type:'act', a }));
  rows.push({ type:'sec', label:`전체 엔드포인트 ${EP_LIST.length}` });
  EP_LIST.forEach(x => rows.push({ type:'ep', x, hits:null }));
  return rows;
}

    return `<li role="presentation"><div class="pal__item" role="option" id="${id}" tabindex="-1" aria-selected="${active}" data-pal-i="${i}"${on}>
      <span class="badge" data-t="muted">액션</span>
      <span class="pal__label" style="font-family:var(--font-ui)">${esc(r.a.label)}</span>
      <span class="pal__right"><span class="pal__enter">↵</span></span>
    </div></li>`;
  }
  return `<li role="presentation"><div class="pal__item" role="option" id="${id}" tabindex="-1" aria-selected="${active}" data-pal-i="${i}"${on}>
    <span class="badge" data-t="muted">스코프</span>
    <span class="pal__label" style="font-family:var(--font-ui)">${esc(r.sc.label)}</span>
    <span class="pal__right"><span class="pal__enter">↵</span></span>
  </div></li>`;
}

function renderPal(){
  const list = $('#palette-list-k09');
  const input = $('#palette-input-k08');
  const rows = palRows();
  state.palRows = rows;

  const pick = rows.filter(r => r.type === 'ep' || r.type === 'act' || r.type === 'scope');
  const helps = rows.filter(r => r.type === 'help');
  const isHelp = state.palScope === 'help';
  list.setAttribute('role', isHelp ? 'list' : 'listbox');

  if (!pick.length && !helps.length){
    list.innerHTML = `<li class="pal__none">${input.value ? `<b>${esc(input.value)}</b>` : ''}일치하는 엔드포인트나 액션이 없습니다.</li>`;
    $('#palette-count-k0b').textContent = '0개';
    input.removeAttribute('aria-activedescendant');
    return;
  }
  if (state.palIndex >= pick.length) state.palIndex = 0;
  if (state.palIndex < 0) state.palIndex = Math.max(0, pick.length - 1);

  let html = '', pi = -1, open = false;
  const closeGrp = () => { if (open){ html += '</ul></li>'; open = false; } };
  rows.forEach(r => {
    if (r.type === 'sec'){
      closeGrp();
      if (isHelp){ html += `<li class="pal__sec">${esc(r.label)}</li>`; return; }
      html += `<li role="group" aria-label="${esc(r.label)}"><div class="pal__sec">${esc(r.label)}</div><ul class="pal__grp" role="presentation">`;
      open = true;
      return;
    }
    if (r.type === 'help'){
      html += `<li class="pal__item" style="cursor:default">
        <span class="kbd">${esc(r.k)}</span>
        <span class="pal__label" style="font-family:var(--font-ui)">${esc(r.label)}</span></li>`;
      return;
    }
    pi += 1;
    html += palItemHTML(r, pi, pi === state.palIndex);
  });
  closeGrp();
  list.innerHTML = html;
  $('#palette-count-k0b').textContent = `${pick.length}개`;

  const act = list.querySelector('.pal__item[data-active="1"]');
  if (act){
    input.setAttribute('aria-activedescendant', act.id);
    act.scrollIntoView({ block:'nearest' });
  }
}

function palPickable(){
  return state.palRows.filter(r => r.type === 'ep' || r.type === 'act' || r.type === 'scope');
}

function palRun(r){
  if (!r) return;
  if (r.type === 'ep'){ closePalette(); select(r.x.id); return; }
  if (r.type === 'scope'){ setPalScope(r.sc.id); return; }
  closePalette();
  r.a.run();
}

function setPalScope(id){
  state.palScope = id;
  state.palIndex = 0;
  const wrap = $('#palette-scope-k0a');
  const input = $('#palette-input-k08');
  if (id){
    wrap.hidden = false;
    $('#palette-scope-name-k0c').textContent = SCOPE_NAMES[id];
  } else {
    wrap.hidden = true;
  }
  input.value = '';
  input.placeholder = id === 'help' ? '단축키 검색…' : '엔드포인트, 그룹, 액션 검색…';
  renderPal();
  input.focus();
}

let palReturnFocus = null;
function openPalette(scope){
  palReturnFocus = document.activeElement;
  state.palOpen = true;
  $('#command-palette-k07').hidden = false;
  setPalScope(scope || '');
}
function closePalette(){
  state.palOpen = false;
  $('#command-palette-k07').hidden = true;
  state.palScope = ''; state.palIndex = 0;
  $('#palette-input-k08').value = '';
  if (palReturnFocus && document.contains(palReturnFocus)) palReturnFocus.focus();
}

/* 팔레트가 열려 있는 동안의 키 처리 — 문서 핸들러가 여기로 위임한다 */
function palKeydown(e){
  if (e.key === 'Escape'){ e.preventDefault(); closePalette(); return; }
  if (e.key === 'Backspace' && state.palScope && !$('#palette-input-k08').value){
    e.preventDefault(); setPalScope(''); return;
  }
  if (state.palScope === 'help') return;
  const pick = palPickable();
  if (!pick.length) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); state.palIndex = (state.palIndex + 1) % pick.length; renderPal(); return; }
  if (e.key === 'ArrowUp'){ e.preventDefault(); state.palIndex = (state.palIndex - 1 + pick.length) % pick.length; renderPal(); return; }
  if (e.key === 'Enter'){ e.preventDefault(); palRun(pick[state.palIndex]); return; }
}

$('#palette-input-k08').addEventListener('input', () => { state.palIndex = 0; renderPal(); });
$('#palette-scope-clear-k0d').addEventListener('click', () => setPalScope(''));
document.addEventListener('click', e => {
  const opener = e.target.closest('[data-open-palette]');
  if (opener){ openPalette(opener.getAttribute('data-open-palette')); return; }
  if (e.target.closest('[data-close-palette]')){ closePalette(); return; }
  const item = e.target.closest('.pal__item[data-pal-i]');
  if (item){
    state.palIndex = Number(item.dataset.palI);
    palRun(palPickable()[state.palIndex]);
  }
});

/* 키보드 */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);

  /* 팔레트 — 열기/닫기는 다른 어떤 핸들러보다 먼저 본다 */
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')){
    e.preventDefault(); state.palOpen ? closePalette() : openPalette(''); return;
  }
  if (e.key === '/' && !typing){ e.preventDefault(); openPalette(''); return; }
  if (state.palOpen){ palKeydown(e); return; }
  if (e.key === 'Escape'){
    if ($('#env-menu-6d3').dataset.open === 'true'){ closeEnvMenu(); $('#env-btn-1f5').focus(); return; }
    if (state.drawer){ setDrawer(false); $('#sidebar-toggle-6e4').focus(); return; }
    if (state.statusFilter) resetFilters();
  }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp')){
    const inTree = document.activeElement.closest('#endpoint-tree-a91');
    if (!inTree) return;
    const items = $$('#endpoint-tree-a91 .ep-btn');
    if (!items.length) return;
    e.preventDefault();
    let idx = items.indexOf(document.activeElement);
    if (idx === -1) idx = items.findIndex(i => i.getAttribute('aria-current') === 'true');
    idx = e.key === 'ArrowDown' ? Math.min(items.length-1, idx+1) : Math.max(0, idx-1);
    items[idx].focus();
  }
  /* Enter 는 처리하지 않는다 — .ep-btn 은 네이티브 button 이라 이미 click 이 발생하며,
     여기서 또 select() 를 부르면 한 번의 Enter 로 두 번 실행된다. */
});

/* ============================================================
   BOOT
   ============================================================ */
renderEnvMenu();
setEnv('dev');
renderTree();
renderWorkspace();
</script>
