<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- title --></title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --surface-2: #f2f1ed;
  --border: #dddcd5;
  --text-primary: #1f1f1d;
  --text-secondary: #5c5b55;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --good: #0b7a3b;
  --bad: #c2271b;
  --warn: #8a5a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --surface-2: #252523;
    --border: #3a3a37;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --series-1: #3987e5;
    --series-2: #d95926;
    --good: #4cc27c;
    --bad: #f0776c;
    --warn: #e0b04c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19;
  --surface-2: #252523;
  --border: #3a3a37;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --series-1: #3987e5;
  --series-2: #d95926;
  --good: #4cc27c;
  --bad: #f0776c;
  --warn: #e0b04c;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 16px 48px; background: var(--surface-1); color: var(--text-primary);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
}
main { max-width: 1040px; margin: 0 auto; }
h1 { font-size: 22px; margin: 4px 0 8px; }
h2 { font-size: 16px; margin: 32px 0 10px; }
.muted { color: var(--text-secondary); font-size: 12px; }
.note { color: var(--warn); }
.banner { padding: 12px 14px; border-radius: 8px; background: var(--surface-2); border-left: 4px solid; }
.banner.good { border-color: var(--good); }
.banner.bad { border-color: var(--bad); }
.banner.warn { border-color: var(--warn); }
.banner ul { margin: 6px 0 0; padding-left: 18px; }
.table-wrap, table { width: 100%; }
table { border-collapse: collapse; display: block; overflow-x: auto; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 600; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid; white-space: nowrap; }
.tag.good { color: var(--good); }
.tag.bad { color: var(--bad); }
.tag.warn { color: var(--warn); }
.tag.muted { color: var(--text-secondary); }
.legend { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.key.s1 { background: var(--series-1); }
.key.s2 { background: var(--series-2); margin-left: 8px; }
.strips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; }
figure { margin: 0; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; }
figcaption { font-weight: 600; margin-bottom: 4px; }
svg { width: 100%; height: auto; display: block; }
svg .axis { fill: var(--text-secondary); font-size: 13px; }
svg .grid { stroke: var(--border); stroke-width: 1; }
svg circle { stroke: var(--surface-2); stroke-width: 2; }
svg circle.s1 { fill: var(--series-1); }
svg circle.s2 { fill: var(--series-2); }
svg circle { r: 6; }
svg circle:hover { r: 8; }
svg .med { stroke-width: 2; }
svg .med.s1 { stroke: var(--series-1); }
svg .med.s2 { stroke: var(--series-2); }
</style>
</head>
<body>
<main>
<!-- body -->
</main>
</body>
</html>
