name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Validate plugins (7-category)
        run: python3 scripts/validate-plugin.py

      - name: Sync evals check
        run: python3 scripts/sync-evals.py --check-only

      # marketplace.json 의 description 은 README 표와 kaizen-orchestrator AUTO 블록으로 흘러간다.
      # 둘 다 CI 게이트가 없어서 릴리스 drift 를 아무도 못 잡고 있었다
      # (실측 2026-09-06: bambu-kit v0.7.0 릴리스 후 orchestrator 가 v0.6.0 설명을 들고 있었다).
      - name: Sync docs check
        run: python3 scripts/sync-docs.py --check-only

      - name: Sync orchestrator check
        run: python3 scripts/sync-orchestrator.py --check-only

      - name: Run eval assertions
        run: python3 scripts/run-evals.py --verbose

      # 페이지가 실제로는 접근성을 지키면서도 "3.5:1 FAIL" 같은 틀린 설명을 달고 있을 수 있다.
      # check-docs-a11y.js 는 렌더된 픽셀을 재므로 그런 서술 오류를 못 잡는다 (실측 2026-09-05:
      # typography-scale.html 이 4.61:1 을 3.5:1 FAIL 로 적고 있었다).
      - name: Docs contrast-claim check (문서에 적힌 수치 vs 실제)
        run: python3 scripts/check-contrast-claims.py

      # 문서 사이트는 iframe 으로 페이지를 갈아끼우고 페이지끼리 상대경로로 서로를 인용한다.
      # 경로가 죽으면 화면에 아무 표시도 안 나고 클릭해야 드러난다 (실측 2026-09-05: 46 건).
      - name: Docs internal link check
        run: python3 scripts/check-docs-links.py

      # 생성 HTML 만 고치고 소스 .md 를 빠뜨리면 docs-site 재생성이 조용히 되돌린다.
      # 2026-09-06 하루에 세 번 재발했고 세 번 다 "고친 자리" 만 보고
      # "옛 값이 남았는지" 를 안 봐서 생겼다. 범위가 비면 exit 2 로 실패한다.
      - name: Stale value check (소스에 옛 값이 되살아났는가)
        run: python3 scripts/check-stale-values.py

      # 수집기가 옛 요약본을 오늘자 인사이트보다 먼저 집던 결함(2026-09-24 재현)을 다시 들이지 않게 한다.
      - name: Kaizen collector test (인사이트 입력 선택 · facets)
        run: python3 scripts/test-collect-kaizen-data.py

      # 아래 시험들은 zsh 와 bash 출력을 맞대는데 ubuntu-latest 에는 zsh 가 없다.
      # reflect-kit 시험 둘은 zsh 가 없으면 zsh 경우를 건너뛰고 통과하므로 설치를 모든 시험보다 앞에 둔다
      - name: Install zsh (셸 대조 시험용)
        run: command -v zsh >/dev/null || { sudo apt-get update && sudo apt-get install -y zsh; }

      - name: React-kit project detection test
        run: bash react-kit/evals/scripts/project-detect-test.sh

      - name: Reflect-kit log-reflection hook test
        run: bash reflect-kit/evals/hooks/log-reflection-test.sh

      - name: Reflect-kit project id test (워크트리 · 본 레포 이름)
        run: bash reflect-kit/evals/hooks/project-id-test.sh

      - name: Reflect-kit collect status test
        run: bash reflect-kit/evals/hooks/collect-status-test.sh

      # 이 두 킷의 평가 파일은 <킷>/evals/evals.json 규칙 밖이라 run-evals.py 가 읽지 않는다
      - name: Onboarding-kit gate evals (zsh · bash)
        run: sh onboarding-kit/skills/setup-guide/evals/run-gate-evals.sh

      - name: Howto-kit gate evals (zsh · bash · sh)
        run: sh howto-kit/evals/run-evals.sh

      # 아래 두 시험도 evals.json 규칙 밖이라 run-evals.py 가 읽지 않는다.
      # scenario-report 시험은 보고서 틀이 바뀌면 커밋된 예시 보고서와 바이트로 대조한다 — 돌리는 곳이 없으면 대조가 죽는다
      - name: Flutter-toolkit scenario report test (보고서 틀 · 예시 보고서)
        run: python3 -m unittest discover -s flutter-toolkit/evals/scenario-report -v

      - name: Design-kit decision gate test (결정 전파 검사 종료 코드)
        run: bash design-kit/evals/decision-gate-test.sh

  playwright:
    name: Playwright Visual Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test design-kit/evals/visuals.spec.js

      # api-kit 시험은 <킷>/evals/evals.json 에 runner 만 적고 run-evals.py 킷 목록 밖이다 — 여기서 직접 돌린다.
      # 판정 불가를 PASS 에 합친 ui.html 이면 떨어진다
      - name: Api-kit viewer test (판정 불가 칸 · 예시 ui.html)
        run: npx playwright test api-kit/evals/

      # visuals.spec.js 는 페이지의 텍스트 대비를 재지 않는다 — color-palette.html 의
      # 대비 체커 위젯이 렌더되는지만 본다. 그래서 CI 가 green 인 채로 172 페이지 중
      # 150 개가 WCAG AA 미달이었다 (실측 2026-09-05). 이 스텝이 그 구멍을 막는다.
      - name: Docs accessibility gate (contrast / overflow / touch target)
        run: node scripts/check-docs-a11y.js

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  harness:
    name: Harness Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run feedback save test
        run: bash harness/evals/kaizen/feedback-system/save-test.sh

      - name: Run feedback aggregation test
        run: |
          if command -v yq &>/dev/null; then
            bash harness/evals/kaizen/feedback-system/aggregation-test.sh
          else
            echo "SKIP: yq not installed"
          fi

      - name: Commit guard hook test (대량 삭제 · 되돌림 · 빈 개인 목록)
        run: bash harness/evals/hooks/commit-guard-test.sh

      - name: Dart format-on-edit hook test (편집한 파일 하나만)
        run: bash flutter-toolkit/evals/hooks/format-edited-dart-test.sh
