name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Validate plugins (7-category)
        run: python3 scripts/validate-plugin.py

      - name: Sync evals check
        run: python3 scripts/sync-evals.py --check-only

      # 깨진 evals.json 을 없는 파일처럼 넘겨 위 단계가 통과하던 결함(2026-09-29 Codex 점검)을 다시 들이지 않게 한다
      - name: Sync evals broken file test (여섯 경우 — 깨진 · 못 읽는 · 대상 없는 바로가기 evals.json 은 2, 한 킷만 못 읽어도 나머지를 잰다)
        run: python3 scripts/test-sync-evals.py

      # marketplace.json 의 description 은 README 표와 kaizen-orchestrator AUTO 블록으로 흘러간다.
      # 둘 다 CI 게이트가 없어서 릴리스 drift 를 아무도 못 잡고 있었다
      # (실측 2026-09-06: bambu-kit v0.7.0 릴리스 후 orchestrator 가 v0.6.0 설명을 들고 있었다).
      - name: Sync docs check
        run: python3 scripts/sync-docs.py --check-only

      - name: Sync orchestrator check
        run: python3 scripts/sync-orchestrator.py --check-only

      - name: Run eval assertions
        run: python3 scripts/run-evals.py --verbose

      # eval 항목 0 개를 경고만 하고 통과시키던 결함(2026-09-29 Codex 점검)
      - name: Run evals empty list test (아홉 경우 — 빈 목록 · 목록 열쇠 없음 · 없는 킷 이름 · 못 읽는 파일 · 대상 없는 바로가기는 2, 한 킷만 못 읽어도 나머지를 잰다)
        run: python3 scripts/test-run-evals.py

      # 카이젠 회귀 패턴(harness/evals/kaizen/*/assertions.json)은 evals.json 규칙 밖이라 위 단계가 읽지 않는다.
      # 2026-03-31 에 만든 패턴 하나가 대상 문서 21 판 내내 0 건이었는데 아무도 몰랐다
      - name: Kaizen regression patterns (assertions.json)
        run: python3 scripts/run-kaizen-assertions.py

      # 페이지가 실제로는 접근성을 지키면서도 "3.5:1 FAIL" 같은 틀린 설명을 달고 있을 수 있다.
      # check-docs-a11y.js 는 렌더된 픽셀을 재므로 그런 서술 오류를 못 잡는다 (실측 2026-09-05:
      # typography-scale.html 이 4.61:1 을 3.5:1 FAIL 로 적고 있었다).
      - name: Docs contrast-claim check (문서에 적힌 수치 vs 실제)
        run: python3 scripts/check-contrast-claims.py

      # 문서 사이트는 iframe 으로 페이지를 갈아끼우고 페이지끼리 상대경로로 서로를 인용한다.
      # 경로가 죽으면 화면에 아무 표시도 안 나고 클릭해야 드러난다 (실측 2026-09-05: 46 건).
      - name: Docs internal link check
        run: python3 scripts/check-docs-links.py

      # api-kit 페이지 12 쪽이 원본 출처를 다 싣고 밖에서 받아 오는 자원이 없는지 잰다. 로컬에서만 돌던 검사라
      # 판정식을 넓혀도(2026-09-27 · `<img src>` · `url(//…)` · 빈칸 없는 `@import`) CI 가 되돌림을 못 잡았다.
      - name: api-kit docs check (출처 · 외부 자원 · 테마 키)
        run: python3 scripts/check-api-kit-docs.py
      # 공통 CSS 연결 판정이 rel="preload" · site.css.bak 까지 연결로 셌다(2026-09-29). 판정식만 고치면 되돌림을 못 잡으므로 열 경우를 돌린다
      - name: api-kit docs check test (공통 CSS 연결 판정 열 경우)
        run: python3 scripts/test-check-api-kit-docs.py

      # 생성 HTML 만 고치고 소스 .md 를 빠뜨리면 docs-site 재생성이 조용히 되돌린다.
      # 2026-09-06 하루에 세 번 재발했고 세 번 다 "고친 자리" 만 보고
      # "옛 값이 남았는지" 를 안 봐서 생겼다. 범위가 비면 exit 2 로 실패한다.
      - name: Stale value check (소스에 옛 값이 되살아났는가)
        run: python3 scripts/check-stale-values.py

      # 드리프트 도구의 원본 → 페이지 짝과 docs-site SKILL.md 표는 따로 고쳐져 갈라졌었다 — 짝 넷이 표에도 스크립트에도 없었다
      - name: Docs drift mapping check (스크립트 짝 ↔ docs-site 표)
        run: python3 scripts/detect-docs-drift.py --check-table

      # 드리프트 도구는 모양만 바뀐 원본(표 구분 줄 · 울타리 언어 표시 · 주석)을 기본에서 뺀다. 가름이 내용 바뀐 원본까지
      # 빼면 다시 맞출 쪽을 놓치므로 임시 저장소에서 세 경우를 돌린다
      - name: Docs drift format-only filter test (모양/내용 가름)
        run: python3 scripts/test-detect-docs-drift.py

      # 공통 CSS 링크를 글자 수로 재자 쪽 글에서 이름을 숫자 글자 참조로 쪼개 적는 우회가 생겼다(2026-09-27 세 쪽).
      # <link> 요소로 세고 쪼갠 자리를 잡는다
      - name: Docs common CSS link check (공통 CSS 링크 하나 · 글자 참조 쪼갬 0)
        run: python3 scripts/check-docs-common-css.py
      - name: Docs common CSS link check test (여덟 경우)
        run: python3 scripts/test-check-docs-common-css.py

      # 킷 reviewer 일곱과 flutter-audit 은 평가 가이드의 미검증 규칙을 사본으로 든다. 원문이 바뀌었는데 사본이 따라가지 않은 일이
      # 세 번 있었다(2026-07-27 · 2026-08-13 · 2026-09-24). 사본이 원문과 글자까지 같은지 잰다.
      - name: Reviewer protocol copy check (미검증 규칙 사본 대조)
        run: python3 scripts/check-reviewer-protocol-copies.py

      # flutter-preflight · react-preflight 는 sprint Step 3 의 실패 원인 판정 표를 사본으로 든다.
      # 원문이 강화됐는데 사본 둘이 옛 문장으로 남은 일이 있었다(2026-09-27 Codex 점검).
      - name: Cause table copy check (실패 원인 판정 표 사본 대조)
        run: python3 scripts/check-cause-table-copies.py

      # 설치본은 킷 폴더만 담아 레포 뿌리 docs/<칸>/ 를 못 연다. 그 경로를 쓰는 킷 파일에 raw 주소 안내가
      # backend · rust · infra 에만 있고 나머지 60 개에는 없었다(2026-09-28 실측).
      - name: Install docs guidance check (설치본에서 못 여는 docs/ 경로 안내)
        run: python3 scripts/check-install-docs-guidance.py

      # 못 읽는 킷 파일을 건너뛰고 통과하던 결함(2026-09-29 Codex 점검)
      - name: Install docs guidance unreadable test (못 읽는 파일은 2)
        run: python3 scripts/test-check-install-docs-guidance.py

      # 원문 덩어리 끝을 마지막 경우 줄로 잡았을 때 그 뒤에 더한 줄을 못 봤다(2026-09-28). 다섯 경우로 검사 자체를 잰다
      - name: Cause table copy check test (원문 덩어리 끝 표지)
        run: python3 scripts/test-check-cause-table-copies.py

      # 로컬 CI 도구는 이 파일의 run 단계를 직접 읽는다. 손 목록 도구가 다섯 단계를 빠뜨린 일이 있었다(2026-09-28)
      - name: Local CI tool test (CI 파일 읽기 · 준비 단계 · 못 다루는 열쇠)
        run: bash scripts/test-ci-local.sh

      # 수집기가 옛 요약본을 오늘자 인사이트보다 먼저 집던 결함(2026-09-24 재현)을 다시 들이지 않게 한다.
      - name: Kaizen collector test (인사이트 입력 선택 · facets)
        run: python3 scripts/test-collect-kaizen-data.py

      # 아래 시험들은 zsh 와 bash 출력을 맞대는데 ubuntu-latest 에는 zsh 가 없다.
      # reflect-kit 시험 둘은 zsh 가 없으면 zsh 경우를 건너뛰고 통과하므로 설치를 모든 시험보다 앞에 둔다
      - name: Install zsh (셸 대조 시험용)
        run: command -v zsh >/dev/null || { sudo apt-get update && sudo apt-get install -y zsh; }

      - name: React-kit project detection test
        run: bash react-kit/evals/scripts/project-detect-test.sh

      - name: Reflect-kit log-reflection hook test
        run: bash reflect-kit/evals/hooks/log-reflection-test.sh

      - name: Reflect-kit project id test (워크트리 · 본 레포 이름)
        run: bash reflect-kit/evals/hooks/project-id-test.sh

      - name: Reflect-kit collect status test
        run: bash reflect-kit/evals/hooks/collect-status-test.sh

      # 이 두 킷의 평가 파일은 <킷>/evals/evals.json 규칙 밖이라 run-evals.py 가 읽지 않는다
      - name: Onboarding-kit gate evals (zsh · bash)
        run: sh onboarding-kit/skills/setup-guide/evals/run-gate-evals.sh

      - name: Howto-kit gate evals (zsh · bash · sh)
        run: sh howto-kit/evals/run-evals.sh

      # 아래 두 시험도 evals.json 규칙 밖이라 run-evals.py 가 읽지 않는다.
      # scenario-report 시험은 보고서 틀이 바뀌면 커밋된 예시 보고서와 바이트로 대조한다 — 돌리는 곳이 없으면 대조가 죽는다
      - name: Flutter-toolkit scenario report test (보고서 틀 · 예시 보고서)
        run: python3 -m unittest discover -s flutter-toolkit/evals/scenario-report -v

      - name: Design-kit decision gate test (결정 전파 검사 종료 코드)
        run: bash design-kit/evals/decision-gate-test.sh

      # 슬라이서가 없는 기계라 설치본이 있어야 도는 시험 파일은 「건너뜀」 으로 적힌다 — 나머지는 판정한다
      - name: Bambu-kit gate fixtures · MakerWorld fetch test
        run: |
          bash bambu-kit/evals/run-gate-fixtures.sh
          bash bambu-kit/evals/makerworld-fetch-test.sh

      # 음성 대조 표의 같은 시험 파일 행 · 실행 줄 중복을 첫 행만 보고 넘기던 결함(2026-09-29 Codex 점검)
      - name: Bambu-kit gate fixtures duplicate test (표 행 · 실행 줄 중복)
        run: bash bambu-kit/evals/run-gate-fixtures-test.sh

  playwright:
    name: Playwright Visual Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test design-kit/evals/visuals.spec.js

      # api-kit 뷰어 시험은 브라우저가 필요해 run-evals.py(사례 글만 잰다)가 아니라 여기서 evals.json runner 로 돌린다.
      # 판정 불가를 PASS 에 합친 ui.html 이면 떨어진다
      - name: Api-kit viewer test (판정 불가 칸 · 예시 ui.html)
        run: npx playwright test api-kit/evals/

      # visuals.spec.js 는 페이지의 텍스트 대비를 재지 않는다 — color-palette.html 의
      # 대비 체커 위젯이 렌더되는지만 본다. 그래서 CI 가 green 인 채로 172 페이지 중
      # 150 개가 WCAG AA 미달이었다 (실측 2026-09-05). 이 스텝이 그 구멍을 막는다.
      - name: Docs accessibility gate (contrast / overflow / touch target)
        run: node scripts/check-docs-a11y.js

      # 문서 쪽 Mermaid 예시는 글로만 실려 있어 그려지는지 아무도 안 봤다(2026-09-29). 못박은 Mermaid 로 예시마다 그려 본다
      - name: Docs Mermaid render check (예시가 그림으로 그려지는가)
        run: node scripts/check-docs-mermaid.js
      - name: Docs Mermaid render check test (아홉 경우)
        run: node scripts/test-check-docs-mermaid.js
      # 잴 HTML 이 0 개인데 0/0 PASS 로 끝나던 결함(2026-09-29 Codex 점검)
      - name: Docs accessibility no-page test (HTML 0 개는 2)
        run: bash scripts/test-check-docs-a11y.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  harness:
    name: Harness Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run feedback save test
        run: bash harness/evals/kaizen/feedback-system/save-test.sh

      - name: Run feedback aggregation test
        run: |
          if command -v yq &>/dev/null; then
            bash harness/evals/kaizen/feedback-system/aggregation-test.sh
          else
            echo "SKIP: yq not installed"
          fi

      - name: Commit guard hook test (대량 삭제 · 되돌림 · 빈 개인 목록 · 계약 범위 목록)
        run: bash harness/evals/hooks/commit-guard-test.sh

      # 공용 측정 파일은 bash · zsh 양쪽에서 읽혀야 한다 — ubuntu-latest 에는 zsh 가 없다
      - name: Install zsh (공용 측정 파일 시험용)
        run: command -v zsh >/dev/null || { sudo apt-get update && sudo apt-get install -y zsh; }

      - name: Measure helpers test (도우미 떼기 · 공용 측정 파일)
        run: bash harness/evals/measure/measure-helpers-test.sh

      # superseded 계약이 살아 있는 새 판을 가리키는지 기계로 보는 곳이 없었다(2026-09-28). 도구 시험과 레포 계약 둘을 잰다
      - name: Superseded check test (가리킴 없음 · 없는 계약 · 사슬)
        run: bash harness/evals/superseded/check-superseded-test.sh

      - name: Superseded contracts check (레포 .harness)
        run: bash harness/scripts/check-superseded.sh .harness

      - name: Dart format-on-edit hook test (편집한 파일 하나만)
        run: bash flutter-toolkit/evals/hooks/format-edited-dart-test.sh
