<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d14;
    color: #F5F0E8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Main Content */
  .mockup-content {
    padding: 2rem;
    max-width: 1080px;
    margin: 0 auto;
  }

  /* Sample elements with IDs for demo */
  .demo-sidebar {
    background: #181825;
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    border: 1px solid rgba(245, 240, 232, 0.06);
  }
  .demo-sidebar h3 {
    font-size: 0.85rem;
    color: rgba(245, 240, 232, 0.4);
    margin-bottom: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .demo-sidebar ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .demo-sidebar li {
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    font-size: 0.9rem;
    color: rgba(245, 240, 232, 0.7);
  }

  .demo-card {
    background: #181825;
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    border: 1px solid rgba(245, 240, 232, 0.06);
  }
  .demo-card h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  .demo-card p {
    font-size: 0.9rem;
    color: rgba(245, 240, 232, 0.6);
  }

  .demo-btn {
    display: inline-block;
    padding: 0.5rem 1.25rem;
    border-radius: 8px;
    background: #E8965A;
    color: #0d0d14;
    font-size: 0.85rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }

  /* ID Overlay */
  .id-toggle {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #181825;
    border: 1px solid rgba(245, 240, 232, 0.12);
    color: rgba(245, 240, 232, 0.5);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    z-index: 1000;
  }
  .id-toggle:hover {
    border-color: rgba(232, 150, 90, 0.4);
    color: #E8965A;
  }
  .id-toggle.active {
    background: rgba(232, 150, 90, 0.15);
    border-color: #E8965A;
    color: #E8965A;
  }

  .id-tooltip {
    position: fixed;
    padding: 0.3rem 0.7rem;
    border-radius: 6px;
    background: #E8965A;
    color: #0d0d14;
    font-size: 0.75rem;
    font-weight: 600;
    pointer-events: auto;
    cursor: pointer;
    z-index: 999;
    white-space: nowrap;
    display: none;
  }
  .id-tooltip.copied {
    background: #4ade80;
  }

  [id].id-highlight {
    outline: 2px dashed rgba(232, 150, 90, 0.6);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="mockup-content">
  <!-- {{mockup-content}} -->

  <!-- Sample elements with IDs for demo -->
  <div id="sidebar-nav-a1b2" class="demo-sidebar">
    <h3>Navigation</h3>
    <ul>
      <li>Dashboard</li>
      <li>Tasks</li>
      <li>Settings</li>
    </ul>
  </div>

  <div id="card-task-c3d4" class="demo-card">
    <h2>Task Card</h2>
    <p>Sample task card with ID overlay support. Activate the toggle button to inspect element IDs.</p>
  </div>

  <div id="btn-create-e5f6" class="demo-btn">
    Create New
  </div>
</div>

<!-- ID Overlay Toggle -->
<button class="id-toggle" title="ID Overlay">ID</button>
<div class="id-tooltip"></div>

<script>
(function() {
  var toggle = document.querySelector('.id-toggle');
  var tooltip = document.querySelector('.id-tooltip');
  var active = false;
  var currentEl = null;

  toggle.addEventListener('click', function() {
    active = !active;
    toggle.classList.toggle('active', active);
    if (!active) {
      tooltip.style.display = 'none';
      if (currentEl) {
        currentEl.classList.remove('id-highlight');
        currentEl = null;
      }
    }
  });

  document.addEventListener('mouseover', function(e) {
    if (!active) return;
    var el = e.target.closest('[id]');
    if (!el || el === toggle || el === tooltip) return;

    if (currentEl && currentEl !== el) {
      currentEl.classList.remove('id-highlight');
    }
    currentEl = el;
    el.classList.add('id-highlight');

    tooltip.textContent = '#' + el.id;
    tooltip.classList.remove('copied');
    tooltip.style.display = 'block';

    var rect = el.getBoundingClientRect();
    tooltip.style.left = rect.left + 'px';
    tooltip.style.top = (rect.top - 30) + 'px';
  });

  document.addEventListener('mouseout', function(e) {
    if (!active) return;
    var el = e.target.closest('[id]');
    if (!el) return;
    var related = e.relatedTarget;
    if (related && (related === tooltip || el.contains(related))) return;
    el.classList.remove('id-highlight');
    tooltip.style.display = 'none';
    currentEl = null;
  });

  tooltip.addEventListener('click', function() {
    var id = tooltip.textContent.replace('#', '');
    navigator.clipboard.writeText(id).then(function() {
      tooltip.textContent = 'Copied!';
      tooltip.classList.add('copied');
      setTimeout(function() {
        tooltip.textContent = '#' + id;
        tooltip.classList.remove('copied');
      }, 1200);
    });
  });
})();
</script>
</body>
</html>
