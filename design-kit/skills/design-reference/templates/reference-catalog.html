<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reference Catalog</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d14;
    color: #F5F0E8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    padding: 2rem;
  }
  .container { max-width: 1080px; margin: 0 auto; }

  /* Header */
  header { margin-bottom: 2rem; }
  header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
  }
  .summary {
    font-size: 0.9rem;
    color: rgba(245, 240, 232, 0.5);
  }
  .summary strong { color: #E8965A; }

  /* Filter Bar */
  .filter-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 2rem;
  }
  .filter-btn {
    padding: 0.4rem 1rem;
    border-radius: 8px;
    border: 1px solid rgba(245, 240, 232, 0.12);
    background: #181825;
    color: rgba(245, 240, 232, 0.6);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-btn:hover {
    border-color: rgba(232, 150, 90, 0.4);
    color: #F5F0E8;
  }
  .filter-btn.active {
    background: rgba(232, 150, 90, 0.15);
    border-color: #E8965A;
    color: #E8965A;
  }

  /* Card Grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }
  .card {
    background: #181825;
    border-radius: 12px;
    padding: 1.25rem;
    border: 1px solid rgba(245, 240, 232, 0.06);
    transition: border-color 0.15s ease;
  }
  .card:hover {
    border-color: rgba(232, 150, 90, 0.3);
  }
  .card-channel {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #E8965A;
    margin-bottom: 0.5rem;
  }
  .card-title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }
  .card-title a {
    color: #F5F0E8;
    text-decoration: none;
  }
  .card-title a:hover { text-decoration: underline; }
  .card-meta {
    font-size: 0.8rem;
    color: rgba(245, 240, 232, 0.4);
    margin-bottom: 0.75rem;
  }
  .card-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .card-tag {
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-size: 0.7rem;
    background: rgba(245, 240, 232, 0.06);
    color: rgba(245, 240, 232, 0.5);
  }
  .card-point {
    margin-top: 0.75rem;
    font-size: 0.85rem;
    color: rgba(245, 240, 232, 0.7);
  }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>{{keywords}}</h1>
    <div class="summary">수집 <strong>{{count}}</strong> / {{target}}</div>
  </header>

  <div class="filter-bar">
    <button class="filter-btn active" data-channel="all">전체</button>
    <button class="filter-btn" data-channel="gallery">갤러리</button>
    <button class="filter-btn" data-channel="product">프로덕트</button>
    <button class="filter-btn" data-channel="ds">DS</button>
  </div>

  <div class="card-grid">
    <!-- {{reference-cards}} -->

    <div class="card channel-gallery">
      <div class="card-channel">갤러리</div>
      <div class="card-title"><a href="{{url}}">{{source}}</a></div>
      <div class="card-meta">{{url}}</div>
      <div class="card-tags">
        <span class="card-tag">{{layout}}</span>
        <span class="card-tag">{{color}}</span>
        <span class="card-tag">{{typo}}</span>
      </div>
      <div class="card-point">{{point}}</div>
    </div>

    <div class="card channel-product">
      <div class="card-channel">프로덕트</div>
      <div class="card-title"><a href="{{url}}">{{name}}</a></div>
      <div class="card-meta">{{url}}</div>
      <div class="card-tags">
        <span class="card-tag">{{nav}}</span>
        <span class="card-tag">{{structure}}</span>
        <span class="card-tag">{{components}}</span>
      </div>
      <div class="card-point">{{point}}</div>
    </div>

    <div class="card channel-ds">
      <div class="card-channel">DS</div>
      <div class="card-title"><a href="#">{{ds}}</a></div>
      <div class="card-meta">{{component}}</div>
      <div class="card-tags">
        <span class="card-tag">{{style}}</span>
        <span class="card-tag">{{variants}}</span>
        <span class="card-tag">{{states}}</span>
      </div>
      <div class="card-point">{{point}}</div>
    </div>

  </div>

</div>

<script>
(function() {
  var buttons = document.querySelectorAll('.filter-btn');
  var cards = document.querySelectorAll('.card');

  buttons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      buttons.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');

      var channel = btn.getAttribute('data-channel');

      cards.forEach(function(card) {
        if (channel === 'all') {
          card.classList.remove('hidden');
        } else {
          var match = card.classList.contains('channel-' + channel);
          card.classList.toggle('hidden', !match);
        }
      });
    });
  });
})();
</script>
</body>
</html>
