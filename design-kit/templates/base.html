<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.title">{{TITLE}}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    /* ============================================================
       BASE TEMPLATE — design-kit 공통 골격
       반응형 + 다크/라이트 + 한/영 i18n
       ============================================================ */

    /* --- Reset --- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* --- Color Tokens (Light) --- */
    :root {
      --color-bg: #ffffff;
      --color-surface: #f5f5f5;
      --color-surface-high: #eeeeee;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --color-border: #e0e0e0;
      --color-shadow: rgba(0, 0, 0, 0.08);
      --color-accent: #1a73e8;
      --color-accent-soft: rgba(26, 115, 232, 0.1);
      --color-success: #0d9e5f;
      --color-warning: #e8a817;
      --color-error: #d93025;
      --color-text-on-accent: #ffffff;

      /* Typography */
      --font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --text-xs: clamp(11px, 1vw, 12px);
      --text-sm: clamp(12px, 1.2vw, 14px);
      --text-base: clamp(14px, 1.5vw, 16px);
      --text-lg: clamp(16px, 2vw, 20px);
      --text-xl: clamp(20px, 2.5vw, 28px);
      --text-2xl: clamp(24px, 3.5vw, 40px);
      --text-3xl: clamp(32px, 5vw, 56px);

      /* Spacing */
      --space-xs: clamp(4px, 0.5vw, 6px);
      --space-sm: clamp(8px, 1vw, 12px);
      --space-md: clamp(12px, 2vw, 20px);
      --space-lg: clamp(20px, 3vw, 32px);
      --space-xl: clamp(32px, 5vw, 56px);
      --space-2xl: clamp(48px, 7vw, 80px);

      /* Layout */
      --content-max: 1200px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;

      /* Transitions */
      --transition-color: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* --- Color Tokens (Dark — system) --- */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --color-bg: #121212;
        --color-surface: #1e1e1e;
        --color-surface-high: #2a2a2a;
        --color-text-primary: #e8e8e8;
        --color-text-secondary: #aaaaaa;
        --color-text-tertiary: #777777;
        --color-border: #333333;
        --color-shadow: rgba(0, 0, 0, 0.4);
        --color-accent: #82b4ff;
        --color-accent-soft: rgba(130, 180, 255, 0.15);
        --color-success: #34d399;
        --color-warning: #fbbf24;
        --color-error: #f87171;
      }
    }

    /* --- Color Tokens (Dark — explicit) --- */
    [data-theme="dark"] {
      --color-bg: #121212;
      --color-surface: #1e1e1e;
      --color-surface-high: #2a2a2a;
      --color-text-primary: #e8e8e8;
      --color-text-secondary: #aaaaaa;
      --color-text-tertiary: #777777;
      --color-border: #333333;
      --color-shadow: rgba(0, 0, 0, 0.4);
      --color-accent: #82b4ff;
      --color-accent-soft: rgba(130, 180, 255, 0.15);
      --color-success: #34d399;
      --color-warning: #fbbf24;
      --color-error: #f87171;
    }

    /* --- Base Styles --- */
    body {
      font-family: var(--font-family);
      font-size: var(--text-base);
      line-height: 1.6;
      color: var(--color-text-primary);
      background: var(--color-bg);
      transition: var(--transition-color);
      -webkit-font-smoothing: antialiased;
    }

    :lang(ko) { word-break: keep-all; }
    :lang(en) { word-break: normal; }

    a { color: var(--color-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    img {
      max-width: 100%;
      height: auto;
      transition: filter 0.2s ease;
    }
    [data-theme="dark"] img:not([data-no-dim]) { filter: brightness(0.85); }

    /* --- Toolbar (Theme + Language toggles) --- */
    .base-toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      transition: var(--transition-color);
    }

    .base-toolbar-title {
      margin-right: auto;
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--color-text-secondary);
    }

    .base-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-family: inherit;
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--color-text-primary);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition-color);
      user-select: none;
    }
    .base-btn:hover {
      background: var(--color-surface-high);
    }

    /* --- Page Layout --- */
    .base-page {
      display: grid;
      grid-template-columns: 1fr min(var(--content-max), calc(100% - var(--space-md) * 2)) 1fr;
      min-height: 100vh;
    }
    .base-page > * { grid-column: 2; }
    .base-page > .full-bleed { grid-column: 1 / -1; }

    /* --- Content Sections --- */
    .base-section {
      padding: var(--space-xl) 0;
    }

    .base-section + .base-section {
      border-top: 1px solid var(--color-border);
    }

    /* --- Card Grid --- */
    .base-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-md);
    }

    @media (min-width: 1024px) {
      .base-grid--3col {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* --- Card --- */
    .base-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      transition: var(--transition-color);
    }

    .base-card:hover {
      box-shadow: 0 4px 16px var(--color-shadow);
    }

    /* --- Typography --- */
    .base-h1 { font-size: var(--text-3xl); font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; }
    .base-h2 { font-size: var(--text-2xl); font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
    .base-h3 { font-size: var(--text-xl); font-weight: 600; line-height: 1.4; }
    .base-h4 { font-size: var(--text-lg); font-weight: 600; line-height: 1.4; }
    .base-subtitle { font-size: var(--text-lg); color: var(--color-text-secondary); font-weight: 400; }
    .base-caption { font-size: var(--text-sm); color: var(--color-text-tertiary); }

    /* --- Buttons --- */
    .base-btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 24px;
      font-family: inherit;
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--color-text-on-accent);
      background: var(--color-accent);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .base-btn-primary:hover { opacity: 0.85; }

    /* --- Inputs --- */
    .base-input {
      width: 100%;
      padding: 10px 14px;
      font-family: inherit;
      font-size: var(--text-base);
      color: var(--color-text-primary);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: var(--transition-color);
    }
    .base-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-soft);
    }

    /* --- Tags / Badges --- */
    .base-tag {
      display: inline-block;
      padding: 3px 10px;
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--color-accent);
      background: var(--color-accent-soft);
      border-radius: 100px;
    }

    /* --- Footer --- */
    .base-footer {
      padding: var(--space-lg) 0;
      text-align: center;
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
      border-top: 1px solid var(--color-border);
    }

    /* --- Accessibility --- */
    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* --- Responsive: Tablet --- */
    @media (max-width: 639px) {
      .base-grid {
        grid-template-columns: 1fr;
      }
      .base-toolbar-title {
        display: none;
      }
      .base-h1 { font-size: var(--text-2xl); }
    }

    /* --- Print --- */
    @media print {
      .base-toolbar { display: none; }
      body { background: #fff; color: #000; }
    }
  </style>
</head>
<body>

  <!-- ========== TOOLBAR ========== -->
  <header class="base-toolbar">
    <span class="base-toolbar-title" data-i18n="toolbar.title">{{TOOLBAR_TITLE}}</span>
    <button class="base-btn" onclick="toggleTheme()" aria-label="테마 전환" id="theme-btn">
      <span id="theme-icon">🌙</span>
      <span data-i18n="toolbar.theme" id="theme-label">다크 모드</span>
    </button>
    <button class="base-btn" onclick="switchLang()" aria-label="언어 전환" id="lang-btn">
      <span id="lang-label" lang="en">English</span>
    </button>
  </header>

  <!-- ========== PAGE ========== -->
  <main class="base-page">

    <!-- {{CONTENT}} — 스킬별 템플릿이 이 영역을 채움 -->

    <section class="base-section" style="text-align:center; padding: var(--space-2xl) 0;">
      <h1 class="base-h1" data-i18n="hero.title">{{HERO_TITLE}}</h1>
      <p class="base-subtitle" style="margin-top: var(--space-sm);" data-i18n="hero.subtitle">{{HERO_SUBTITLE}}</p>
    </section>

    <section class="base-section">
      <h2 class="base-h2" data-i18n="section.title">{{SECTION_TITLE}}</h2>
      <div class="base-grid" style="margin-top: var(--space-lg);">
        <div class="base-card">
          <h3 class="base-h4" data-i18n="card.title1">{{CARD_TITLE}}</h3>
          <p style="margin-top: var(--space-sm); color: var(--color-text-secondary);" data-i18n="card.desc1">{{CARD_DESC}}</p>
        </div>
        <div class="base-card">
          <h3 class="base-h4" data-i18n="card.title2">{{CARD_TITLE}}</h3>
          <p style="margin-top: var(--space-sm); color: var(--color-text-secondary);" data-i18n="card.desc2">{{CARD_DESC}}</p>
        </div>
        <div class="base-card">
          <h3 class="base-h4" data-i18n="card.title3">{{CARD_TITLE}}</h3>
          <p style="margin-top: var(--space-sm); color: var(--color-text-secondary);" data-i18n="card.desc3">{{CARD_DESC}}</p>
        </div>
      </div>
    </section>

    <!-- {{/CONTENT}} -->

    <footer class="base-footer">
      <p data-i18n="footer.text">design-kit base template</p>
    </footer>
  </main>

  <!-- ========== SCRIPTS ========== -->
  <script>
    /* ---- Theme Toggle ---- */
    (function initTheme() {
      const saved = localStorage.getItem('dk-theme')
        ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      applyTheme(saved);
    })();

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const icon = document.getElementById('theme-icon');
      const label = document.getElementById('theme-label');
      if (icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';
      if (label) {
        const lang = document.documentElement.lang;
        label.textContent = theme === 'dark'
          ? (lang === 'ko' ? '라이트 모드' : 'Light Mode')
          : (lang === 'ko' ? '다크 모드' : 'Dark Mode');
      }
    }

    function toggleTheme() {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('dk-theme', next);
      applyTheme(next);
    }

    /* ---- i18n ---- */
    const T = {
      ko: {
        toolbar: { title: '{{TOOLBAR_TITLE}}', theme: '다크 모드' },
        hero: { title: '{{HERO_TITLE}}', subtitle: '{{HERO_SUBTITLE}}' },
        section: { title: '{{SECTION_TITLE}}' },
        card: { title1: '{{CARD1}}', desc1: '{{DESC1}}', title2: '{{CARD2}}', desc2: '{{DESC2}}', title3: '{{CARD3}}', desc3: '{{DESC3}}' },
        footer: { text: 'design-kit base template' }
      },
      en: {
        toolbar: { title: '{{TOOLBAR_TITLE_EN}}', theme: 'Dark Mode' },
        hero: { title: '{{HERO_TITLE_EN}}', subtitle: '{{HERO_SUBTITLE_EN}}' },
        section: { title: '{{SECTION_TITLE_EN}}' },
        card: { title1: '{{CARD1_EN}}', desc1: '{{DESC1_EN}}', title2: '{{CARD2_EN}}', desc2: '{{DESC2_EN}}', title3: '{{CARD3_EN}}', desc3: '{{DESC3_EN}}' },
        footer: { text: 'design-kit base template' }
      }
    };

    let currentLang = localStorage.getItem('dk-lang') || 'ko';

    (function initLang() {
      applyLang(currentLang);
    })();

    function applyLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      localStorage.setItem('dk-lang', lang);

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const text = el.dataset.i18n.split('.').reduce((obj, k) => obj?.[k], T[lang]);
        if (text) el.textContent = text;
      });

      // 언어 토글 버튼 업데이트
      const langLabel = document.getElementById('lang-label');
      if (langLabel) {
        langLabel.textContent = lang === 'ko' ? 'English' : '한국어';
        langLabel.lang = lang === 'ko' ? 'en' : 'ko';
      }

      // 테마 버튼 텍스트도 언어에 맞게
      applyTheme(document.documentElement.dataset.theme);
    }

    function switchLang() {
      applyLang(currentLang === 'ko' ? 'en' : 'ko');
    }
  </script>
</body>
</html>
