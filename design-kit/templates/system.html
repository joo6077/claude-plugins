<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{project_name}} — Design System</title>
  <style>
    :root {
      /* {{tokens_placeholder}} — 프로젝트 토큰이 여기에 주입됨 */
      --color-primary: #3b82f6;
      --color-surface: #ffffff;
      --color-text: #1f2937;
      --radius-md: 8px;
      --space-unit: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; color: var(--color-text); background: var(--color-surface); padding: calc(var(--space-unit) * 4); }
    .section { margin-bottom: calc(var(--space-unit) * 6); }
    .section h2 { font-size: 1.5rem; margin-bottom: calc(var(--space-unit) * 2); border-bottom: 1px solid #e5e7eb; padding-bottom: var(--space-unit); }
    .swatch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--space-unit); }
    .swatch { height: 80px; border-radius: var(--radius-md); display: flex; align-items: end; padding: var(--space-unit); font-size: 0.75rem; }
    .type-scale { display: flex; flex-direction: column; gap: var(--space-unit); }
    .type-sample { padding: var(--space-unit); border-left: 3px solid var(--color-primary); }
    .spacing-demo { display: flex; gap: var(--space-unit); align-items: end; }
    .spacing-block { background: var(--color-primary); opacity: 0.3; }
  
    /* 가로 오버플로 방지 (하드 제약 — 제거 금지)
       grid 자식의 기본 min-width 는 auto(= min-content) 라, 긴 코드·표·안 끊기는
       토큰의 최소폭이 트랙 폭으로 전파되어 문서 전체를 밀어낸다.
       내용을 자르지(overflow:hidden) 말고 min-width:0 으로 트랙을 풀어준다. */
    .swatch-grid > * { min-width: 0; }
</style>
</head>
<body>
  <h1>{{project_name}} Design System</h1>
  <p>Generated by design-kit/design-system skill</p>

  <div class="section">
    <h2>Colors</h2>
    <div class="swatch-grid">
      <!-- {{color_swatches}} -->
      <div class="swatch" style="background: var(--color-primary); color: white;">primary</div>
    </div>
  </div>

  <div class="section">
    <h2>Typography</h2>
    <div class="type-scale">
      <!-- {{type_scale}} -->
      <div class="type-sample" style="font-size: 2rem; font-weight: 700;">Heading 1</div>
      <div class="type-sample" style="font-size: 1.5rem; font-weight: 600;">Heading 2</div>
      <div class="type-sample" style="font-size: 1rem;">Body</div>
      <div class="type-sample" style="font-size: 0.875rem;">Caption</div>
    </div>
  </div>

  <div class="section">
    <h2>Spacing</h2>
    <div class="spacing-demo">
      <!-- {{spacing_blocks}} -->
      <div class="spacing-block" style="width: 8px; height: 8px;"></div>
      <div class="spacing-block" style="width: 16px; height: 16px;"></div>
      <div class="spacing-block" style="width: 24px; height: 24px;"></div>
      <div class="spacing-block" style="width: 32px; height: 32px;"></div>
      <div class="spacing-block" style="width: 48px; height: 48px;"></div>
    </div>
  </div>

  <div class="section">
    <h2>Border Radius</h2>
    <!-- {{radius_samples}} -->
    <div style="display: flex; gap: 16px;">
      <div style="width: 60px; height: 60px; background: #e5e7eb; border-radius: 4px;"></div>
      <div style="width: 60px; height: 60px; background: #e5e7eb; border-radius: 8px;"></div>
      <div style="width: 60px; height: 60px; background: #e5e7eb; border-radius: 16px;"></div>
      <div style="width: 60px; height: 60px; background: #e5e7eb; border-radius: 9999px;"></div>
    </div>
  </div>
</body>
</html>
